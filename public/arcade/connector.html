<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connector Rush — LexiUp Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--fire:#FF5A1F;--fire2:#FF9A0A;--ink:#1B1433;--soft:#6B6585;--mist:#F7F5FC;--line:#E6E1F0;--peach:#FFE9DF;--ok:#12A15C;--bad:#E5443E;
--display:"Unbounded","Arial Black",system-ui,sans-serif;--body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font:400 16px/1.5 var(--body);color:var(--ink);background:var(--mist);-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(circle at 50% 30%,#FFF5F0,#F7F5FC 70%)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.38;animation:orb 12s ease-in-out infinite alternate}
.bg i:nth-child(1){width:420px;height:420px;background:var(--fire2);top:-120px;left:-120px}
.bg i:nth-child(2){width:320px;height:320px;background:#8A5CFF;bottom:-80px;right:-60px;animation-delay:-6s}
@keyframes orb{to{transform:translate(60px,50px) scale(1.12)}}

.top{position:sticky;top:0;z-index:50;background:rgba(247,245,252,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:12px;height:64px;padding:0 20px}
.logo{display:flex;align-items:center;gap:9px;font:800 22px var(--display);letter-spacing:-.04em}
.logo svg{width:26px;height:30px}
.menu-btn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font:700 13.5px var(--body);transition:.2s}
.menu-btn:hover{border-color:var(--fire);color:var(--fire);transform:translateY(-1px)}
.menu-btn svg{width:16px;height:16px}
.lang-wrap{position:relative}
.lang-btn{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font:600 13px var(--body);transition:.2s}
.lang-btn:hover{border-color:var(--fire)}
.lang-btn svg{width:14px;height:14px;transition:transform .25s}
.lang-wrap.open .lang-btn svg{transform:rotate(180deg)}
.lang-menu{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 40px -22px rgba(27,20,51,.5);padding:6px;min-width:150px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:.2s}
.lang-wrap.open .lang-menu{opacity:1;transform:none;pointer-events:auto}
.lang-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;font:600 14px var(--body);text-align:left;transition:background .15s}
.lang-item:hover{background:var(--peach)}
.lang-item.on{color:var(--fire);background:#FFF3EC}
.lang-item.on::after{content:"✓";margin-left:auto;font-weight:700}

main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:28px 18px 70px}
.box{position:relative;isolation:isolate;overflow:hidden;min-height:640px;display:flex;flex-direction:column;padding:26px;background:rgba(255,255,255,.93);border-radius:32px;box-shadow:0 40px 70px -34px rgba(27,20,51,.35),inset 0 0 0 1px var(--line);transition:transform .08s}
.box::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--fire2),var(--fire),#8A5CFF)}
.box.danger::after{content:"";position:absolute;inset:0;border-radius:32px;pointer-events:none;box-shadow:inset 0 0 80px rgba(229,68,62,.5);animation:hb .8s ease-in-out infinite;z-index:4}
@keyframes hb{50%{opacity:.35}}

/* hud */
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.hud-i.r{text-align:right}
.lbl{font:600 11px var(--body);color:var(--soft);text-transform:uppercase;letter-spacing:.08em}
.val{font:800 26px/1.2 var(--display);letter-spacing:-.03em;display:inline-block}
.val.bump{animation:bump .35s}.val.bad{color:var(--bad)}.val.danger{color:var(--bad);animation:bump 1s infinite}
.combo{padding:8px 14px;border-radius:999px;background:var(--mist);font:800 13px var(--display);color:var(--soft);transition:.3s}
.combo.hot{background:linear-gradient(135deg,var(--fire2),var(--fire));color:#fff;box-shadow:0 10px 20px -10px var(--fire)}
.tbar{height:6px;border-radius:6px;background:var(--mist);margin-top:14px;overflow:hidden}
.tbar i{display:block;height:100%;transform-origin:left;background:linear-gradient(90deg,var(--fire2),var(--fire))}

/* arena */
.arena{--p:0;position:relative;height:128px;margin:18px 0 6px;border-radius:22px;overflow:hidden;background:linear-gradient(#2E2452,#1B1433);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 22px 30px -24px rgba(27,20,51,.7)}
.arena::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 90%,rgba(255,154,10,.28),transparent 45%)}
.belt{position:absolute;left:0;right:0;bottom:0;height:30px;background:repeating-linear-gradient(90deg,#3D3263 0 22px,#33295A 22px 44px);border-top:2px solid rgba(255,255,255,.12);animation:belt .9s linear infinite}
@keyframes belt{to{background-position:44px 0}}
.heat{position:absolute;inset:0;background:linear-gradient(90deg,transparent 25%,rgba(255,90,31,calc(var(--p)*.5)));pointer-events:none}
.saw{position:absolute;bottom:14px;left:calc(-70px + var(--p)*(100% - 60px));width:82px;height:82px;z-index:2}
.saw svg{width:100%;height:100%;animation:spin .6s linear infinite;filter:drop-shadow(0 0 calc(var(--p)*16px) rgba(255,90,31,.9)) drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.saw.fast svg{animation-duration:.22s}
.lexy{position:absolute;right:16px;bottom:24px;width:58px;height:70px;z-index:1;transition:transform .5s,filter .5s}
.lexy svg{width:100%;height:100%;filter:drop-shadow(0 10px 14px rgba(255,90,31,.45));animation:bob 3.6s ease-in-out infinite}
.lexy.scared svg{animation:tremble .18s linear infinite}
.lexy.jump svg{animation:jump .7s}
.lexy.out{filter:grayscale(1) brightness(.55);transform:scale(.8) translateY(10px) rotate(14deg)}
.lexy.out svg{animation:none}
.sp{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--fire2);box-shadow:0 0 8px var(--fire2);pointer-events:none;animation:spark .55s forwards;z-index:3}
.puff{position:absolute;width:34px;height:34px;border-radius:50%;background:radial-gradient(#cfc9e0,transparent 70%);pointer-events:none;animation:puff 1.3s forwards;z-index:3}

/* question */
.qw{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:18px 0 4px}
.sent{font:700 clamp(20px,4.2vw,27px)/1.45 var(--body);text-align:center;max-width:620px;margin:0 auto;min-height:78px;animation:up .35s both}
.blank{display:inline-block;min-width:84px;height:34px;border-bottom:3px dashed var(--fire);vertical-align:middle;margin:0 6px;color:var(--fire);font-weight:800;line-height:30px;padding:0 6px}
.blank.ok{border:0;background:#DDF6EC;color:var(--ok);border-radius:10px;animation:pop .35s}
.blank.bad{border:0;background:#FDE4E2;color:var(--bad);border-radius:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:560px;margin:0 auto}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--line);border-radius:18px;background:#fff;font:700 16px var(--body);text-align:left;transition:border-color .2s,transform .2s,box-shadow .2s,background .2s;animation:up .4s both}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
.opt i{flex:none;width:30px;height:30px;border-radius:10px;background:var(--mist);display:grid;place-items:center;font:800 12px var(--display);font-style:normal;color:var(--soft);transition:.2s}
.opt:hover{border-color:var(--fire2);transform:translateY(-3px);box-shadow:0 14px 22px -14px rgba(255,90,31,.5)}
.opt:hover i{background:var(--peach);color:var(--fire)}
.opt:active{transform:scale(.97)}
.opt.ok{border-color:var(--ok);background:#DDF6EC;color:var(--ok);animation:pop .35s}.opt.ok i{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:#FDE4E2;color:var(--bad);animation:shake .4s}.opt.bad i{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}.opt:disabled:hover{transform:none;box-shadow:none}
.fl{position:absolute;left:50%;top:6px;font:800 26px var(--display);color:var(--ok);pointer-events:none;animation:flt .9s forwards}
.keys{text-align:center;font:500 12px var(--body);color:var(--soft);margin-top:4px}

/* feedback sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:3px solid var(--bad);border-radius:26px 26px 0 0;padding:22px 24px 26px;text-align:center;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);box-shadow:0 -20px 40px -20px rgba(27,20,51,.25)}
.sheet.show{transform:none}
.sheet h4{font:800 19px var(--display);color:var(--bad);margin-bottom:8px}
.sheet .ans{font:600 15px var(--body);color:var(--soft);margin-bottom:6px}.sheet .ans b{color:var(--ok)}
.sheet .rule{font:500 15px/1.5 var(--body);color:var(--ink);max-width:520px;margin:0 auto 16px}
.sheet .rule b{color:var(--fire)}

/* overlays */
.ov{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 22px;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);text-align:center;overflow-y:auto;transition:opacity .4s,visibility .4s,transform .4s}
.ov.hide{opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.03)}
.ov h1{font:800 clamp(30px,6vw,42px)/1.1 var(--display);letter-spacing:-.03em;margin-bottom:12px}
.ov p.d{color:var(--soft);max-width:44ch;margin-bottom:20px}
.hero{display:flex;align-items:center;justify-content:center;gap:10px;height:96px;margin-bottom:10px}
.hero svg.f{width:62px;height:76px;animation:bob 3.6s ease-in-out infinite}
.hero svg.s{width:74px;height:74px;animation:spin 1.4s linear infinite}
.hero .arrow{font:800 22px var(--display);color:var(--fire);animation:nudge 1s ease-in-out infinite}
.dcs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:520px;margin-bottom:22px}
.dc{padding:14px 8px;border-radius:18px;border:2px solid var(--line);background:#fff;transition:.2s}
.dc b{display:block;font:800 13px var(--display);letter-spacing:-.02em;margin-bottom:4px}
.dc small{display:block;font:500 12px var(--body);color:var(--soft)}
.dc .bs{margin-top:8px;font:600 11px var(--body);color:var(--soft)}
.dc:hover{border-color:var(--fire2);transform:translateY(-2px)}
.dc.on{border-color:var(--fire);background:#FFF3EC;transform:translateY(-3px);box-shadow:0 14px 24px -16px var(--fire)}
.dc.on b{color:var(--fire)}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;padding:17px 34px;border-radius:16px;background:var(--fire);color:#fff;font:700 16px var(--display);box-shadow:0 14px 26px -12px rgba(255,90,31,.8);transition:.15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn.sm{padding:12px 26px;font-size:14px;border-radius:14px}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 3.2s infinite}
.btn svg{width:20px;height:20px}
.stars{font-size:38px;letter-spacing:6px;color:var(--line);margin-bottom:8px}
.stars span.on{color:#FFB400;display:inline-block;animation:star .5s both;animation-delay:calc(var(--k)*.15s + .3s)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:420px;margin:12px 0 16px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px;animation:up .5s both}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}.card:nth-child(4){animation-delay:.24s}
.card .v{font:800 28px var(--display);color:var(--fire)}
.rec{color:var(--ok);font:800 14px var(--display);animation:pop .6s}
.rv{width:100%;max-width:440px;text-align:left;margin-bottom:18px}
.rv h5{font:600 11px var(--body);color:var(--soft);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;text-align:center}
.rv div{padding:10px 14px;border-radius:14px;background:var(--mist);margin-bottom:8px;font-size:13.5px;color:var(--soft)}
.rv div b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}.rv div u{text-decoration:none;color:var(--ok);font-weight:700}
.rv div em{font-style:normal}.rv div em b{display:inline;color:var(--fire)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes tremble{25%{transform:translate(-2px,1px) rotate(-3deg)}75%{transform:translate(2px,-1px) rotate(3deg)}}
@keyframes jump{30%{transform:translateY(-30px) scale(.92,1.1)}60%{transform:none scale(1.1,.9)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{50%{transform:scale(1.07)}}
@keyframes bump{50%{transform:scale(1.18)}}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
@keyframes flt{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}
@keyframes spark{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
@keyframes puff{to{opacity:0;transform:translate(var(--dx),-70px) scale(3)}}
@keyframes shine{to{left:170%}}
@keyframes nudge{50%{transform:translateX(6px)}}
@keyframes star{from{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}to{transform:none}}
@media(max-width:520px){.box{padding:20px 14px}.opts{grid-template-columns:1fr}.val{font-size:21px}.dc b{font-size:12px}.sent{min-height:96px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style id="x-clamp-fix">html,body{overflow-x:hidden}body{overflow-wrap:anywhere}</style>
</head>
<body>
<div class="bg"><i></i><i></i></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs><linearGradient id="fg" x1="0.2" y1="1" x2="0.8" y2="0"><stop offset="0" stop-color="#FF4E1A"/><stop offset="1" stop-color="#FF9A0A"/></linearGradient>
 <radialGradient id="mg"><stop offset="0" stop-color="#F6F3FC"/><stop offset="1" stop-color="#A39CBC"/></radialGradient></defs>
 <symbol id="flame" viewBox="0 0 100 120"><path fill="url(#fg)" d="M42 3C54 6 66 15 70 28c2 7 1 14-2 21 5-1 8-7 8-14 7 5 12 14 12 25 7 8 10 18 10 28 0 17-20 28-46 28C21 117 2 105 2 87c0-17 12-31 26-41 10-8 16-17 14-43z"/><rect x="17" y="64" width="66" height="30" rx="15" fill="#fff"/><ellipse cx="34" cy="79" rx="4" ry="6" fill="#151515"/><ellipse cx="66" cy="79" rx="4" ry="6" fill="#151515"/><path d="M43.5 78h13c-.5 6-4 10-6.500 10s-6-4-6.500-10z" fill="#151515"/></symbol>
 <symbol id="blade" viewBox="0 0 100 100"><polygon class="teeth" fill="url(#mg)" stroke="#6B6585" stroke-width="2" stroke-linejoin="round"/><circle cx="50" cy="50" r="27" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3" stroke-dasharray="9 11"/><circle cx="50" cy="50" r="10" fill="#1B1433"/><circle cx="50" cy="50" r="4" fill="#FF9A0A"/></symbol>
 <symbol id="home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2v-9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
 <symbol id="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
 <symbol id="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></symbol>
</svg>

<header class="top"><div class="bar">
 <a class="logo" href="/app"><svg viewBox="0 0 100 120" aria-hidden="true"><use href="#flame"/></svg>LexiUp</a>
 <a class="menu-btn" href="/"><svg><use href="#home"/></svg><span data-i18n="menu"></span></a>
 <div class="lang-wrap" id="lw">
  <button class="lang-btn" id="lb" aria-haspopup="true"><span id="cf">🇷🇺</span><span id="cl">RU</span><svg><use href="#chev"/></svg></button>
  <div class="lang-menu">
   <button class="lang-item" data-l="ru">🇷🇺 Русский</button><button class="lang-item" data-l="en">🇬🇧 English</button>
   <button class="lang-item" data-l="kz">🇰🇿 Қазақша</button><button class="lang-item" data-l="uz">🇺🇿 O‘zbekcha</button>
  </div>
 </div>
</div></header>

<main>
 <div class="box" id="box">
  <div class="hud">
   <div class="hud-i"><div class="lbl" data-i18n="score"></div><div class="val" id="score">0</div></div>
   <div class="combo" id="combo">🔥 x1</div>
   <div class="hud-i r"><div class="lbl" data-i18n="time"></div><div class="val" id="time">60s</div></div>
  </div>
  <div class="tbar"><i id="tbar"></i></div>

  <div class="arena" id="arena">
   <div class="belt"></div><div class="heat"></div>
   <div class="saw" id="saw"><svg viewBox="0 0 100 100"><use href="#blade"/></svg></div>
   <div class="lexy" id="lexy"><svg viewBox="0 0 100 120"><use href="#flame"/></svg></div>
  </div>

  <div class="qw" id="qw">
   <div class="sent" id="sent"></div>
   <div class="opts" id="opts"></div>
   <div class="keys" data-i18n="keys"></div>
  </div>

  <div class="sheet" id="sheet">
   <h4 data-i18n="fbt"></h4>
   <div class="ans"><span data-i18n="right"></span> <b id="rightW"></b></div>
   <div class="rule" id="rule"></div>
   <button class="btn sm" id="cont"><span data-i18n="cont"></span></button>
  </div>

  <div class="ov" id="startOv">
   <div class="hero"><svg class="s" viewBox="0 0 100 100"><use href="#blade"/></svg><span class="arrow">›››</span><svg class="f" viewBox="0 0 100 120"><use href="#flame"/></svg></div>
   <h1>Connector Rush</h1>
   <p class="d" data-i18n="desc"></p>
   <div class="dcs" id="dcs">
    <button class="dc on" data-d="easy"><b>IELTS 4–5.5</b><small data-i18n="e.sub"></small><div class="bs"><span data-i18n="best"></span> <span id="b0">0</span></div></button>
    <button class="dc" data-d="medium"><b>IELTS 6–7</b><small data-i18n="m.sub"></small><div class="bs"><span data-i18n="best"></span> <span id="b1">0</span></div></button>
    <button class="dc" data-d="hard"><b>IELTS 7.5+</b><small data-i18n="h.sub"></small><div class="bs"><span data-i18n="best"></span> <span id="b2">0</span></div></button>
   </div>
   <button class="btn" id="go"><svg><use href="#play"/></svg><span data-i18n="start"></span></button>
  </div>

  <div class="ov hide" id="endOv">
   <div class="stars" id="stars"><span style="--k:0">★</span><span style="--k:1">★</span><span style="--k:2">★</span></div>
   <h1 id="endT"></h1>
   <div class="rec" id="rec" style="display:none" data-i18n="rec"></div>
   <div class="grid">
    <div class="card"><div class="lbl" data-i18n="score"></div><div class="v" id="rS">0</div></div>
    <div class="card"><div class="lbl" data-i18n="corr"></div><div class="v" id="rC">0</div></div>
    <div class="card"><div class="lbl" data-i18n="acc"></div><div class="v" id="rA">0%</div></div>
    <div class="card"><div class="lbl" data-i18n="bst"></div><div class="v" id="rB">0</div></div>
   </div>
   <div class="rv" id="rv"></div>
   <button class="btn" id="again"><svg><use href="#play"/></svg><span data-i18n="again"></span></button>
  </div>
 </div>
</main>

<script>
/* ---------- questions: [sentence, answer, wrong, wrong, wrong, rule] ---------- */
var BANK={
easy:[
["I was tired, ___ I went to bed early.","so","but","because","although","<b>So</b> вводит результат: устал, поэтому лёг спать."],
["I stayed at home ___ I was ill.","because","so","but","or","<b>Because</b> объясняет причину."],
["She is rich, ___ she is not happy.","but","so","because","until","<b>But</b> показывает контраст."],
["___ it was raining, we played football.","Although","Because","So","But","<b>Although</b> + предложение = «хотя». В начале предложения <b>but</b> не ставят."],
["We cancelled the picnic ___ the rain.","because of","because","although","so","<b>Because of</b> + существительное, <b>because</b> + целое предложение."],
