<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пробный тест — Lexy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fire:#FF5A1F; --fire2:#FF9A0A; --ink:#1B1433; --soft:#6B6585;
  --mist:#F7F5FC; --line:#E6E1F0; --peach:#FFE9DF; --ok:#12A15C;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:400 16px/1.55 var(--body);color:var(--ink);background:var(--mist);-webkit-font-smoothing:antialiased;min-height:100dvh}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--fire);outline-offset:3px}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .bar{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:12px;height:62px;padding:0 20px}
.logo{display:flex;align-items:center;gap:9px;font:800 22px var(--display);letter-spacing:-.04em}
.logo svg{width:26px;height:30px}
.top .sp{flex:1}
.top .who{font-size:13px;color:var(--soft);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .back{font-size:13.5px;font-weight:700;color:var(--soft)}
.top .back:hover{color:var(--ink)}
.wrap{max-width:920px;margin:0 auto;padding:34px 20px 80px}
h1{font:800 clamp(24px,4.5vw,36px)/1.15 var(--display);letter-spacing:-.03em;margin-bottom:8px}
.s{color:var(--soft);font-size:14.5px}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 18px 40px -34px rgba(27,20,51,.45)}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.skill{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:18px;transition:border-color .2s,transform .15s,box-shadow .2s}
.skill:hover{border-color:var(--fire);transform:translateY(-2px);box-shadow:0 18px 32px -26px rgba(27,20,51,.5)}
.skill .em{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--peach)}
.skill .tx{flex:1;min-width:0}
.skill .tx b{display:block;font-size:15.5px}
.skill .tx small{display:block;color:var(--soft);font-size:12.5px;margin-top:2px}
.skill .arrow{color:var(--soft);font-size:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:999px;background:var(--fire);color:#fff;font-weight:700;font-size:14.5px;box-shadow:0 12px 24px -12px rgba(255,90,31,.75);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:#C9BEE0}
.btn.sm{padding:11px 18px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.progress{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:22px 0 8px}
.progress i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--fire2),var(--fire));transition:width .3s}
.qmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--soft);font-weight:600}
.qtext{font:700 clamp(19px,3vw,25px)/1.35 var(--display);letter-spacing:-.02em;margin:24px 0 8px}
.transcript{background:var(--mist);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--soft);margin-bottom:6px}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:15px 16px;background:#fff;border:1.5px solid var(--line);border-radius:16px;font-size:14.5px;transition:border-color .15s,background .15s,transform .15s}
.opt:hover{border-color:#C9BEE0;transform:translateY(-1px)}
.opt .key{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--mist);font-weight:800;font-size:12.5px;color:var(--soft)}
.opt.on{border-color:var(--fire);background:#FFF8F3}
.opt.on .key{background:var(--fire);color:#fff}
.opt.right{border-color:var(--ok);background:#F1FBF6}
.opt.wrong{border-color:#E5443E;background:#FFF2F1}
textarea{width:100%;min-height:220px;resize:vertical;font:400 15px/1.55 var(--body);color:var(--ink);padding:16px;border:1.5px solid var(--line);border-radius:16px;outline:none;background:#fff}
textarea:focus{border-color:var(--fire);box-shadow:0 0 0 4px rgba(255,90,31,.12)}
.meta{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:12.5px;color:var(--soft)}
.meta b{color:var(--ink)}
.check{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:#fff;border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;cursor:pointer;font-size:14px}
.check input{margin-top:3px;accent-color:var(--fire);width:18px;height:18px;flex:none}
.note{background:#FFF8F3;border:1px dashed #FFC2A1;border-radius:16px;padding:14px 16px;font-size:13.5px;margin-top:16px}
.result{text-align:center;max-width:560px;margin:30px auto 0}
.result .band{font:800 64px/1 var(--display);letter-spacing:-.05em;color:var(--fire);margin:14px 0 4px}
.result .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:700}
.result p{color:var(--soft);font-size:14px;margin-top:14px}
.hist{margin-top:20px;display:grid;gap:10px}
.hrow{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:16px}
.hrow .em{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--peach);font-size:18px}
.hrow .tx{flex:1;min-width:0}
.hrow b{display:block;font-size:14.5px}
.hrow small{color:var(--soft);font-size:12.5px}
.hrow .b{font:800 18px var(--display);color:var(--fire)}
.empty{text-align:center;color:var(--soft);padding:40px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hero2{background:linear-gradient(135deg,#FFF3EB,#F0E9FF);border:1.5px solid var(--line);border-radius:24px;padding:22px;margin-bottom:16px}
.hero2 h2{font:800 24px var(--display);letter-spacing:-.02em;margin-bottom:6px}
.hero2 .row2{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 10px}
.hero2 .row2 div b{font:800 22px var(--display);display:block}
.hero2 .row2 div small{color:var(--soft);font-size:12px}
.bar{height:8px;border-radius:999px;background:rgba(27,20,51,.08);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--fire2),var(--fire));transition:width .3s}
.mut{color:var(--soft);font-size:12px;font-weight:600}
.tasks{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.taskrow{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;transition:.15s}
.taskrow:hover{border-color:#FFC2A1;transform:translateX(2px)}
.taskrow .tn{width:36px;height:36px;flex:none;border-radius:12px;display:grid;place-items:center;font:800 15px var(--display);background:var(--mist);color:var(--soft)}
.taskrow .ttx{flex:1;min-width:0}
.taskrow .ttx b{display:block;font:700 15px var(--body)}
.taskrow .ttx small{color:var(--soft);font-size:12px}
.taskrow .tb{font:800 14px var(--display);color:var(--soft)}
.taskrow.done{border-color:#C8EAD7;background:#F1FBF6}
.taskrow.done .tn{background:#DDF6EC;color:var(--ok)}
.taskrow.done .tb{color:var(--ok)}
.taskrow.lock{opacity:.6}
.skill .bar{margin:8px 0 6px}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font:700 13px var(--body);color:var(--ink);transition:.15s;flex:none}
.back:hover{border-color:var(--fire);color:var(--fire);transform:translateX(-2px)}
.back .arr{color:var(--fire);font-weight:800}
.tabs{display:flex;gap:22px;max-width:920px;margin:0 auto;padding:2px 20px 0;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.tabs::-webkit-scrollbar{display:none}
.tabs:empty{display:none}
.tabp{display:inline-flex;align-items:center;gap:7px;padding:10px 2px 14px;background:transparent;border:0;border-bottom:2.5px solid transparent;font:700 13.5px var(--body);color:var(--soft);white-space:nowrap;transition:color .15s,border-color .15s;flex:none}
.tabp:hover{color:var(--fire)}
.tabp.on{color:var(--ink);border-bottom-color:var(--fire)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero2,.skill,.taskrow,.card{animation:fadeUp .45s both}
.hub .skill:nth-child(2){animation-delay:.05s}
.hub .skill:nth-child(3){animation-delay:.1s}
.hub .skill:nth-child(4){animation-delay:.15s}
.tasks .taskrow:nth-child(2){animation-delay:.03s}
.tasks .taskrow:nth-child(3){animation-delay:.06s}
.tasks .taskrow:nth-child(4){animation-delay:.09s}
.tasks .taskrow:nth-child(5){animation-delay:.12s}
.tasks .taskrow:nth-child(6){animation-delay:.15s}
.tasks .taskrow:nth-child(7){animation-delay:.18s}
.tasks .taskrow:nth-child(8){animation-delay:.21s}
.skill .em{transition:transform .2s}
.skill:hover .em{transform:scale(1.08) rotate(-3deg)}
@media(max-width:640px){
  .hub{grid-template-columns:1fr}
  .top .who{display:none}
  .top .bar{padding:0 14px;gap:8px}
  .tabs{padding:2px 14px 0;gap:18px}
  .wrap{padding:22px 16px 60px}
  .card{padding:20px;border-radius:20px}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="flameGrad" x1="0.2" y1="1" x2="0.8" y2="0"><stop offset="0" stop-color="#FF4E1A"/><stop offset="1" stop-color="#FF9A0A"/></linearGradient></defs>
  <symbol id="logo-flame" viewBox="0 0 100 120"><path fill="url(#flameGrad)" d="M42 3C54 6 66 15 70 28c2 7 1 14-2 21 5-1 8-7 8-14 7 5 12 14 12 25 7 8 10 18 10 28 0 17-20 28-46 28C21 117 2 105 2 87c0-17 12-31 26-41 10-8 16-17 14-43z"/><rect x="17" y="64" width="66" height="30" rx="15" fill="#fff"/><ellipse cx="34" cy="79" rx="4" ry="6" fill="#151515"/><ellipse cx="66" cy="79" rx="4" ry="6" fill="#151515"/><path d="M43.5 78h13c-.5 6-4 10-6.500 10s-6-4-6.500-10z" fill="#151515"/></symbol>
</svg>

<header class="top">
  <div class="bar">
    <a class="logo" href="dashboard.html"><svg viewBox="0 0 100 120" aria-hidden="true"><use href="#logo-flame"/></svg>Lexy</a>
    <div class="sp"></div>
    <a class="back" href="dashboard-english.html#practice" onclick="__lexyBack(event)"><span class="arr">←</span> Назад</a>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>

<script src="lexy-config.js?v=7"></script>
<script src="lexy-auth.js?v=10"></script>
<script src="lexy-content.js?v=1"></script>
<script>
(function(){
  var user = window.LexyAuth ? LexyAuth.user() : null;
  if(!user){ location.replace('login.html'); return; }

  var app = document.getElementById('app');
  window.__lexyBack = function(e){ if(e) e.preventDefault(); if(history.length > 1) history.back(); else location.href = 'dashboard-english.html#practice'; };

  var C = window.LexyContent;
  var SKILLS = {
    reading:   { name:'Reading',   em:'📖', mins:10, desc:'текст · вопросы на понимание' },
    listening: { name:'Listening', em:'🎧', mins:8,  desc:'аудио с озвучкой · ловушки и детали' },
    writing:   { name:'Writing',   em:'✍️', mins:20, desc:'эссе Task 2 · 250+ слов' },
    speaking:  { name:'Speaking',  em:'🗣', mins:10, desc:'карточка Part 2 · монолог' }
  };
  var ORDER = ['reading','listening','writing','speaking'];
  function setTabs(active){
    var tb = document.getElementById('tabs');
    if(!tb) return;
    if(!active){ tb.innerHTML = ''; return; }
    tb.innerHTML = ORDER.map(function(k){ return '<a class="tabp'+(k===active?' on':'')+'" href="test.html?skill='+k+'">'+SKILLS[k].em+' '+SKILLS[k].name+'</a>'; }).join('');
  }

  function premium(){ var u = LexyAuth.user(); return !!(u && u.premium); }

  var qs = new URLSearchParams(location.search);
  var skill = qs.get('skill');
  var mode = qs.get('mode');
  var num = qs.get('n');
  var full = qs.get('full') === '1';
  var isFull = full;

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function today(){
    var d = new Date();
    return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
  }
  function toast(t){
    var el = document.getElementById('toast');
    el.textContent = t; el.classList.add('on');
    clearTimeout(toast.t); toast.t = setTimeout(function(){ el.classList.remove('on'); }, 2600);
  }
  function roundBand(b){
    b = Math.max(4, Math.min(9, b));
    return Math.round(b * 2) / 2;
  }
  function tests(){ return (LexyAuth.user() || {}).tests || {}; }
  function nextNum(s){
    var n = 1, t = tests();
    while(t[s + '-' + n]) n++;
    return n;
  }
  function doneCount(s){ var t = tests(), n = 0; Object.keys(t).forEach(function(k){ if(k.indexOf(s + '-') === 0) n++; }); return n; }
  function bestBand(s){ var t = tests(), b = null; Object.keys(t).forEach(function(k){ if(k.indexOf(s + '-') === 0){ var v = t[k].band; if(v != null && (b == null || v > b)) b = v; } }); return b; }
  function totalDone(){ var n = 0; ORDER.forEach(function(k){ n += doneCount(k); }); return n; }
  function totalCount(){ var n = 0; ORDER.forEach(function(k){ n += C.count(k); }); return n; }
  function saveResult(s, key, data){
    var u = LexyAuth.user();
    var t = Object.assign({}, u.tests || {});
    t[key] = Object.assign({ date: Date.now() }, data);
    var mins = Object.assign({}, u.mins || {}), d = today();
    mins[d] = (mins[d] || 0) + (SKILLS[s].mins || 5);
    LexyAuth.update({ tests: t, mins: mins });
  }

  function renderHub(kind){
    var title = kind === 'full' ? 'Полный экзамен' : kind === 'baseline' ? 'Замер уровня' : 'Задания';
    var sub = kind === 'full'
      ? 'Пройди все четыре секции подряд — в конце Lexy соберёт общий результат.'
      : kind === 'baseline'
        ? 'Пройди по одному заданию каждого навыка, чтобы открыть стартовый балл.'
        : 'Тренируй навыки по реальным заданиям IELTS. Результат сохраняется в кабинете.';
    var paid = premium(), td = totalDone(), tc = totalCount(), pct = tc ? Math.round(td / tc * 100) : 0;
    var hero = '<div class="hero2"><h2>' + title + '</h2><p class="s">' + sub + '</p>' +
      '<div class="row2"><div><b>' + td + '</b><small>пройдено</small></div><div><b>' + tc + '</b><small>всего заданий</small></div><div><b>' + pct + '%</b><small>прогресс</small></div></div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
    var cards = ORDER.map(function(k){
      var s = SKILLS[k], cnt = C.count(k), done = doneCount(k), bb = bestBand(k);
      var tag = paid ? (cnt + ' заданий · Premium') : (C.freeLimit(k) + ' бесплатно из ' + cnt);
      return '<a class="skill" href="test.html?skill=' + k + '">' +
        '<span class="em">' + s.em + '</span>' +
        '<span class="tx"><b>' + s.name + '</b><small>' + s.desc + ' · ~' + s.mins + ' мин</small>' +
        '<div class="bar"><i style="width:' + Math.round(done / cnt * 100) + '%"></i></div>' +
        '<small class="mut">' + done + ' из ' + cnt + (bb != null ? ' · лучший ' + bb.toFixed(1) : '') + ' · <span style="color:var(--fire)">' + tag + '</span></small></span>' +
        '<span class="arrow">›</span></a>';
    }).join('');
    var freeNote = paid
      ? '<div class="note" style="background:#F1FBF6;border-color:#C8EAD7">Premium активен — открыты все задания, игры и Lexy AI.</div>'
      : '<div class="note">Бесплатно доступна часть заданий: ' + C.freeLimit('reading') + ' чтение, ' + C.freeLimit('listening') + ' аудирование, ' + C.freeLimit('writing') + ' письмо, ' + C.freeLimit('speaking') + ' говорение. Полный доступ — в <a href="pricing.html" style="color:var(--fire);font-weight:700">тарифах</a>.</div>';
    app.innerHTML = hero + '<div class="hub">' + cards + '</div>' + freeNote +
      '<div class="card" style="margin-top:16px"><b>Как это работает</b><ul style="margin:10px 0 0 18px;color:var(--soft);font-size:13.5px;line-height:1.7"><li>Выбери навык → откроется список заданий по номерам.</li><li>Каждое задание: текст/аудио/эссе/монолог и вопросы.</li><li>Результат сохраняется, учитывается лучший балл.</li><li>Бесплатно — первые задания, остальное на Premium.</li></ul></div>' +
      '<div class="row"><a class="btn ghost sm" href="dashboard-english.html#practice" onclick="__lexyBack(event)">← Назад</a>' +
      '<a class="btn ghost sm" href="test.html?history=1">История заданий</a></div>';
  }

  function renderSkillList(k){
    var s = SKILLS[k], cnt = C.count(k), done = doneCount(k), paid = premium();
    var rows = '';
    for(var n = 1; n <= cnt; n++){
      var key = k + '-' + n, t = tests()[key], locked = C.isLocked(k, n, paid);
      var cls = t ? ' done' : locked ? ' lock' : '';
      var badge = t ? (t.band != null ? t.band.toFixed(1) : (t.score != null ? t.score + '/' + t.total : '✓')) : (locked ? '🔒' : '');
      var sub2 = t ? 'пройдено' : locked ? 'Premium' : 'доступно';
      rows += '<a class="taskrow' + cls + '" href="' + (locked ? 'pricing.html' : 'test.html?skill=' + k + '&n=' + n) + '"><span class="tn">' + n + '</span><span class="ttx"><b>' + s.name + ' · ' + n + '</b><small>' + sub2 + '</small></span><span class="tb">' + badge + '</span></a>';
    }
    app.innerHTML = '<h1>' + s.name + '</h1><p class="s">' + done + ' из ' + cnt + ' пройдено · ' + s.desc + '</p>' +
      '<div class="bar"><i style="width:' + Math.round(done / cnt * 100) + '%"></i></div>' +
      '<div class="tasks">' + rows + '</div>' +
      '<div class="row"><a class="btn sm" href="test.html?skill=' + k + '&n=' + nextNum(k) + '">Продолжить</a>' +
      '<a class="btn ghost sm" href="dashboard-english.html#practice" onclick="__lexyBack(event)">← Назад</a></div>';
  }

  function renderLock(k, n){
    var s = SKILLS[k];
    app.innerHTML = '<h1>' + s.name + ' · задание ' + n + '</h1>' +
      '<div class="card" style="margin-top:16px;text-align:center">' +
      '<div style="font-size:44px">🔒</div>' +
      '<h2 style="font-family:var(--display);margin:10px 0">Доступно в Premium</h2>' +
      '<p class="s">Бесплатно открыто ' + C.freeLimit(k) + ' задания «' + s.name + '». Чтобы пройти все ' + C.count(k) + ' — оформи Premium.</p>' +
      '<div class="row" style="justify-content:center"><a class="btn" href="pricing.html">Получить Premium</a>' +
      '<a class="btn ghost" href="test.html">Вернуться к заданиям</a></div></div>';
  }

  var VOICE = null;
  function pickVoice(){
    if(!('speechSynthesis' in window)) return;
    var vs = speechSynthesis.getVoices() || [];
    VOICE = vs.filter(function(v){ return /en[-_](GB|US|AU)/i.test(v.lang); })[0] || vs.filter(function(v){ return /^en/i.test(v.lang); })[0] || null;
  }
  if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text, btn){
    if(!('speechSynthesis' in window)){ toast('Озвучка не поддерживается в этом браузере'); return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = (VOICE && VOICE.lang) || 'en-GB';
    if(VOICE) u.voice = VOICE;
    u.rate = 0.95;
    if(btn){
      btn.dataset.playing = '1'; btn.textContent = '⏸ Стоп';
      u.onend = u.onerror = function(){ btn.dataset.playing = ''; btn.textContent = '▶ Прослушать'; };
    }
    speechSynthesis.speak(u);
  }

  function renderHistory(){
    var t = tests(), keys = Object.keys(t).sort(function(a,b){ return (t[b].date||0) - (t[a].date||0); });
    var html = '<h1>История тестов</h1><p class="s">Все пройденные секции и результаты.</p>';
    if(!keys.length){
      html += '<div class="card" style="margin-top:22px"><div class="empty">Пока пусто. Пройди первый тест — результат появится здесь.</div></div>';
    } else {
      html += '<div class="hist">' + keys.map(function(k){
        var x = t[k], s = SKILLS[x.skill || k.split('-')[0]] || SKILLS.reading;
        var date = x.date ? new Date(x.date).toLocaleDateString('ru-RU', {day:'numeric', month:'long'}) : '—';
        var val = x.band != null ? x.band.toFixed(1) : (x.score != null ? x.score + '/' + x.total : '—');
        return '<div class="hrow"><span class="em">' + s.em + '</span>' +
          '<div class="tx"><b>' + s.name + '</b><small>' + date + (x.words ? ' · ' + x.words + ' слов' : '') + '</small></div>' +
          '<div class="b">' + val + '</div></div>';
      }).join('') + '</div>';
    }
    html += '<div class="row"><a class="btn sm" href="test.html">К тестам</a><a class="btn ghost sm" href="dashboard.html">В кабинет</a></div>';
    app.innerHTML = html;
  }

  function renderQuiz(k, n, isFull){
    var item = C.item(k, n);
    var list = item.q;
    var i = 0, picked = null, score = 0, answered = false;
    function draw(){
      var q = list[i];
      var html = '<h1>' + SKILLS[k].name + ' · ' + item.t + '</h1>' +
        '<p class="s">Вопрос ' + (i+1) + ' из ' + list.length + ' · выбери один вариант</p>' +
        '<div class="progress"><i style="width:' + Math.round(i/list.length*100) + '%"></i></div>' +
        '<div class="card" style="margin-top:16px">';
      if(k === 'reading'){
        html += '<div class="transcript" style="background:#fff;border-style:solid"><b>' + esc(item.t) + '</b><br>' + esc(item.p) + '</div>';
      } else{
        html += '<div class="transcript">🎧 Аудио · нажми «Прослушать» и ответь на вопрос.</div>' +
          '<div class="row" style="margin-top:0"><button class="btn" id="play">▶ Прослушать</button></div>' +
          '<audio id="au" preload="none" src="' + C.audioFor(item.script) + '"></audio>';
      }
      html += '<div class="qtext">' + esc(q.q) + '</div>' +
        '<div class="opts">' + q.o.map(function(o, x){
          return '<button class="opt" data-x="' + x + '"><span class="key">' + 'ABCD'[x] + '</span>' + esc(o) + '</button>';
        }).join('') + '</div>' +
        '<div class="row"><button class="btn" id="next" disabled>Далее →</button></div></div>';
      app.innerHTML = html;
      picked = null; answered = false;
      if(k === 'listening'){
        var pb = document.getElementById('play'), au = document.getElementById('au');
        if(au) au.addEventListener('error', function(){ au.dataset.fail = '1'; });
        pb.addEventListener('click', function(){
          if(pb.dataset.playing){ try{ speechSynthesis.cancel(); }catch(e){} try{ au.pause(); }catch(e){} pb.dataset.playing=''; pb.textContent='▶ Прослушать'; return; }
          if(au && !au.dataset.fail){
            try{ var pr = au.play(); if(pr && pr.catch) pr.catch(function(){ speak(item.script, pb); }); else { pb.dataset.playing='1'; pb.textContent='⏸ Стоп'; au.onended=function(){ pb.dataset.playing=''; pb.textContent='▶ Прослушать'; }; } }
            catch(e){ speak(item.script, pb); }
          } else speak(item.script, pb);
        });
      }
      app.querySelectorAll('.opt').forEach(function(b){
        b.addEventListener('click', function(){
          if(answered) return;
          app.querySelectorAll('.opt').forEach(function(x){ x.classList.remove('on'); });
          b.classList.add('on');
          picked = +b.dataset.x;
          document.getElementById('next').disabled = false;
        });
      });
      document.getElementById('next').addEventListener('click', function(){
        if(picked == null) return;
        if(!answered){
          answered = true;
          try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
          var correct = app.querySelectorAll('.opt')[q.a];
          correct.classList.add('right');
          if(picked !== q.a){
            app.querySelectorAll('.opt')[picked].classList.add('wrong');
          } else score++;
          var btn = document.getElementById('next');
          btn.textContent = i === list.length - 1 ? 'Показать результат →' : 'Следующий вопрос →';
          btn.disabled = false;
        } else {
          i++;
          if(i < list.length) draw();
          else finishQuiz();
        }
      });
    }
    function finishQuiz(){
      var total = list.length;
      var band = roundBand(5 + (score/total) * 3.5);
      var key = k + '-' + (typeof n === 'number' ? n : nextNum(k));
      saveResult(k, key, { skill:k, score:score, total:total, band:band, full:isFull });
      renderResult(k, band, 'Правильных ответов: ' + score + ' из ' + total + '.', isFull);
    }
    draw();
  }

  function renderWriting(k, n, isFull){
    var item = C.item(k, n);
    app.innerHTML = '<div class="card" style="margin-top:4px">' +
        '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><span style="width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#FFF3EC,#FFE3D2);font-size:22px">✍️</span><div><div style="font:800 20px var(--display);letter-spacing:-.02em">Writing · Task 2</div><div class="s" style="margin:0">Эссе · ориентир ' + item.min + '+ слов</div></div></div>' +
        '<div class="qtext">' + esc(item.prompt) + '</div>' +
        '<textarea id="essay" placeholder="Начни писать здесь…"></textarea>' +
        '<div class="meta"><span>Слов: <b id="wc">0</b></span><span>Минимум: <b>' + item.min + '</b></span></div>' +
        '<div class="row"><button class="btn" id="done" disabled>Завершить Writing</button></div>' +
      '</div>';
    var ta = document.getElementById('essay'), wc = document.getElementById('wc'), done = document.getElementById('done');
    ta.addEventListener('input', function(){
      var words = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
      wc.textContent = words;
      done.disabled = words < 30;
    });
    done.addEventListener('click', function(){
      var words = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
      var band = words >= item.min ? 6.5 : words >= 150 ? 6.0 : 5.0;
      var key = k + '-' + (typeof n === 'number' ? n : nextNum(k));
      saveResult(k, key, { skill:k, words:words, band:band, full:isFull });
      renderResult(k, band, 'Объём: ' + words + ' слов. ' + (words >= item.min ? 'Отличный объём для Task 2.' : 'Попробуй раскрыть тему подробнее — желательно ' + item.min + '+ слов.'), isFull);
    });
  }

  function renderSpeaking(k, n, isFull){
    var item = C.item(k, n);
    var note = 'Совет: отвечай вслух 1,5–2 минуты, затронув все пункты. Записывать не нужно — просто отметь, что раскрыл.';
    app.innerHTML = '<div class="card" style="margin-top:4px">' +
        '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><span style="width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#FFF3EC,#FFE3D2);font-size:22px">🗣</span><div><div style="font:800 20px var(--display);letter-spacing:-.02em">Speaking · ' + item.part + '</div><div class="s" style="margin:0">Практика Speaking · монолог</div></div></div>' +
        '<div class="qtext">' + esc(item.prompt) + '</div>' +
        '<p class="s" style="margin-bottom:14px">You should say:</p>' +
        item.points.map(function(p, i){
          return '<label class="check"><input type="checkbox" data-p="' + i + '"><span>' + esc(p) + '</span></label>';
        }).join('') +
        '<div class="row" style="margin-top:4px"><button class="btn ghost sm" id="read">🔊 Послушать тему</button></div>' +
        '<div class="note">' + note + '</div>' +
        '<div class="row"><button class="btn" id="done" disabled>Завершить Speaking</button></div>' +
      '</div>';
    var checks = app.querySelectorAll('.check input');
    var done = document.getElementById('done');
    var read = document.getElementById('read');
    read.addEventListener('click', function(){ speak(item.prompt + '. ' + item.points.join('. '), null); });
    checks.forEach(function(c){ c.addEventListener('change', function(){ done.disabled = false; }); });
    done.addEventListener('click', function(){
      var nDone = 0; checks.forEach(function(c){ if(c.checked) nDone++; });
      var band = nDone >= 4 ? 7.0 : nDone >= 3 ? 6.5 : 6.0;
      var key = k + '-' + (typeof n === 'number' ? n : nextNum(k));
      saveResult(k, key, { skill:k, points:nDone, band:band, full:isFull });
      renderResult(k, band, 'Раскрыто пунктов: ' + nDone + ' из ' + item.points.length + '. ' + (nDone >= item.points.length ? 'Хорошая структура ответа.' : 'Постарайся затронуть все пункты карточки.'), isFull);
    });
  }

  function renderResult(k, band, note, isFull){
    var idx = ORDER.indexOf(k);
    var next = isFull && idx < ORDER.length - 1 ? ORDER[idx+1] : null;
    app.innerHTML = '<div class="card result">' +
      '<div style="font-size:38px">🎉</div>' +
      '<h1 style="margin-top:8px">Секция пройдена!</h1>' +
      '<div class="lbl">Оценка</div>' +
      '<div class="band">' + band.toFixed(1) + '</div>' +
      '<p>' + esc(note) + '</p>' +
      '<div class="row" style="justify-content:center">' +
        (next
          ? '<a class="btn" href="test.html?skill=' + next + '&n=full&full=1">Следующая секция: ' + SKILLS[next].name + ' →</a>'
          : '<a class="btn" href="dashboard-english.html#practice" onclick="__lexyBack(event)">← Назад</a>') +
        '<a class="btn ghost" href="test.html?skill=' + k + (isFull ? '&full=1&n=full' : '&n=' + nextNum(k)) + '">Пройти ещё раз</a>' +
      '</div></div>';
  }

  function startSkill(k, n, isFull){
    if(C.isLocked(k, n, premium())){ renderLock(k, n); return; }
    if(k === 'reading' || k === 'listening') renderQuiz(k, n, isFull);
    else if(k === 'writing') renderWriting(k, n, isFull);
    else renderSpeaking(k, n, isFull);
  }

  if(qs.get('history')){ setTabs(null); renderHistory(); }
  else if(skill && SKILLS[skill]){
    setTabs(skill);
    if(/^\d+$/.test(num || '')) startSkill(skill, parseInt(num, 10), full);
    else renderSkillList(skill);
  } else { setTabs(null); renderHub(mode); }
})();
</script>
