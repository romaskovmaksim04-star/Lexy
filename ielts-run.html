<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("lang");if(l)document.documentElement.setAttribute("lang",l);}catch(e){}</script>
<title>Задание — GoLexi</title>
<link rel="stylesheet" href="golexi/fonts.css">
<link rel="stylesheet" href="golexi/app.css">
<style>:root{--font-unbounded:"Unbounded";--font-onest:"Onest"}html,body{margin:0}</style>
</head>
<body>
<main class="mx-auto w-full max-w-5xl px-4 py-6 md:px-8 md:py-10"><div id="root"></div></main>
<script src="lexy-config.js?v=7"></script>
<script src="lexy-auth.js?v=11"></script>
<script src="lexy-ielts-data.js?v=1"></script>
<script src="lexy-ielts-tasks.js?v=9"></script>
<script>
(function () {
  var D = window.LEXY_IELTS || {};
  function strip(groups) {
    return (groups || []).map(function (g) {
      return Object.assign({}, g, { questions: (g.questions || []).map(function (q) { return Object.assign({}, q, { answer: [], why: "" }); }) });
    });
  }
  function token() { return (window.LexyAuth && LexyAuth.token) ? LexyAuth.token().catch(function () { return null; }) : Promise.resolve(null); }
  function waitToken(n) {
    n = n || 0;
    return token().then(function (t) {
      if (t) return t;
      if (n > 25) return null;
      return new Promise(function (r) { setTimeout(r, 300); }).then(function () { return waitToken(n + 1); });
    });
  }
  function mountReading(t) { window.IeltsTasks.mount(document.getElementById("root"), { kind: "reading", test: t }); }
  function mountListening(t) {
    var groups = strip(t.groups);
    var items = (t.script || []).map(function (l) { var v = ((t.speakers[l.speaker] || {}).voice) || "female"; return { text: l.text, voice: v }; });
    waitToken().then(function (tk) {
      var c = window.LEXY_SUPABASE || {}, base = String(c.url || "").replace(/\/+$/, "");
      return fetch(base + "/functions/v1/tts-sign", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + tk, apikey: c.anonKey || "" }, body: JSON.stringify({ items: items }) }).then(function (r) { return r.json(); });
    }).then(function (d) {
      var audio = (d && d.audio) || [];
      var lines = (t.script || []).map(function (l, i) { var v = ((t.speakers[l.speaker] || {}).voice) || "female"; return { audio: audio[i] || "", text: l.text, female: String(v).indexOf("female") === 0 }; });
      window.IeltsTasks.mount(document.getElementById("root"), { kind: "listening", test: t, lines: lines, groups: groups });
    }).catch(function () {
      var lines = (t.script || []).map(function (l) { return { audio: "", text: l.text, female: false }; });
      window.IeltsTasks.mount(document.getElementById("root"), { kind: "listening", test: t, lines: lines, groups: groups });
    });
  }
  var INTRO = { 1: "Good morning. In this part, I'd like to ask you some questions about yourself.", 2: "Now I'm going to give you a topic, and I'd like you to talk about it for one to two minutes. You have one minute to prepare. You can make some notes if you wish.", 3: "We've been talking about this topic. Now I'd like to discuss with you some more general questions related to it." };
  function mountSpeaking(t) {
    var questions = (t.questions || []).map(function (q, i) {
      var spoken = String(q);
      if (t.part === 2) spoken = spoken.split("\n")[0];
      var say = i === 0 ? (INTRO[t.part] + " " + spoken) : spoken;
      return { text: String(q), spoken: say, audio: "audio/speaking/" + t.id + "_" + i + ".wav", slow: "audio/speaking/" + t.id + "_" + i + "_slow.wav" };
    });
    window.IeltsTasks.mount(document.getElementById("root"), { kind: "speaking", test: t, questions: questions });
  }
  function run() {
    var root = document.getElementById("root");
    var h = (location.hash || "").replace(/^#\/?/, "").split("/");
    var section = h[0], id = h[1];
    if (section === "reading") { var t = (D.reading || []).filter(function (x) { return x.id === id; })[0]; if (t && window.IeltsTasks) { mountReading(t); return; } }
    if (section === "listening") { var l = (D.listening || []).filter(function (x) { return x.id === id; })[0]; if (l && window.IeltsTasks) { mountListening(l); return; } }
    if (section === "writing") { var w = (D.writing || []).filter(function (x) { return x.id === id; })[0]; if (w && window.IeltsTasks) { window.IeltsTasks.mount(root, { kind: "writing", test: w }); return; } }
    if (section === "speaking") { var sp = (D.speaking || []).filter(function (x) { return x.id === id; })[0]; if (sp && window.IeltsTasks) { mountSpeaking(sp); return; } }
    if (section && id) { location.replace("ielts-test.html#/" + section + "/" + id); return; }
    root.innerHTML = '<p>Задание не найдено. <a href="dashboard-ielts.html">← В кабинет</a></p>';
  }
  if (document.readyState !== "loading") run(); else document.addEventListener("DOMContentLoaded", run);
})();
</script>
<script src="golexi-i18n.js?v=1"></script>
</body>
</html>
