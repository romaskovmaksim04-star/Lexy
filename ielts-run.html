<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Задание — Lexi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lexy-face.css?v=3">
<link rel="stylesheet" href="lexy-dark.css?v=13">
<style>:root{--font-unbounded:"Unbounded";--font-onest:"Onest"}*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);font-family:var(--font-onest),system-ui,sans-serif;-webkit-font-smoothing:antialiased;margin:0}</style>
</head>
<body>
<main class="mx-auto w-full max-w-5xl px-4 py-6 md:px-8 md:py-10"><div id="root"></div></main>
<script src="lexy-ielts-data.js?v=1"></script>
<script src="lexy-ielts-tasks.js?v=1"></script>
<script src="lexy-theme.js?v=2"></script>
<script>
(function () {
  function run() {
    var root = document.getElementById("root");
    var h = (location.hash || "").replace(/^#\/?/, "").split("/");
    var section = h[0], id = h[1];
    var D = window.LEXY_IELTS || {};
    if (section === "reading" && window.IeltsTasks) {
      var test = (D.reading || []).filter(function (t) { return t.id === id; })[0];
      if (test) { window.IeltsTasks.mount(root, { test: test }); return; }
    }
    if (section && id) { location.replace("ielts-test.html#/" + section + "/" + id); return; }
    root.innerHTML = '<p>Задание не найдено. <a href="dashboard-ielts.html">← В кабинет</a></p>';
  }
  if (document.readyState !== "loading") run(); else document.addEventListener("DOMContentLoaded", run);
})();
</script>
</body>
</html>
