<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Личный кабинет — Lexy</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{display:grid;place-items:center;background:var(--mist)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs><linearGradient id="fg" x1="0.2" y1="1" x2="0.8" y2="0"><stop offset="0" stop-color="#FF4E1A"/><stop offset="1" stop-color="#FF9A0A"/></linearGradient></defs>
 <symbol id="flame" viewBox="0 0 100 120"><path fill="url(#fg)" d="M42 3C54 6 66 15 70 28c2 7 1 14-2 21 5-1 8-7 8-14 7 5 12 14 12 25 7 8 10 18 10 28 0 17-20 28-46 28C21 117 2 105 2 87c0-17 12-31 26-41 10-8 16-17 14-43z"/><rect x="17" y="64" width="66" height="30" rx="15" fill="#fff"/><ellipse cx="34" cy="79" rx="4" ry="6" fill="#151515"/><ellipse cx="66" cy="79" rx="4" ry="6" fill="#151515"/><path d="M43.5 78h13c-.5 6-4 10-6.500 10s-6-4-6.500-10z" fill="#151515"/></symbol>
 <symbol id="ic-chat" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></symbol>
 <symbol id="ic-grad" viewBox="0 0 24 24"><path d="M2 8l10-4 10 4-10 4L2 8z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 10v5c0 1.5 3 3 6 3s6-1.5 6-3v-5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
</svg>

<div class="modal-veil on" id="modal">
  <div class="modal-box">
    <h2>Выбери свой путь</h2>
    <p>Мы настроим платформу под твои цели. Потом это можно будет изменить в настройках.</p>
    <div class="path-options">
      <button class="path-opt" onclick="choosePath('english')">
        <div class="ic"><svg viewBox="0 0 24 24"><use href="#ic-chat"/></svg></div>
        <div class="tx">
          <b>Разговорный английский</b>
          <span>Практика речи с ИИ, слова и фразы, без экзаменов</span>
        </div>
      </button>
      <button class="path-opt" onclick="choosePath('ielts')">
        <div class="ic"><svg viewBox="0 0 24 24"><use href="#ic-grad"/></svg></div>
        <div class="tx">
          <b>Подготовка к IELTS</b>
          <span>Пробные экзамены, статистика, Preppy AI и игры</span>
        </div>
      </button>
    </div>
  </div>
</div>

<script>
  // ПРОВЕРКА: если уже залогинен — проверяем путь
  var isLoggedIn = localStorage.getItem('user_logged_in') === 'true';
  var userPath = localStorage.getItem('user_path');

  if (!isLoggedIn) {
    // Если не залогинен — на вход
    window.location.replace('login.html');
  } else if (userPath === 'english') {
    // Если выбрал английский — на английский дашборд
    window.location.replace('dashboard-english.html');
  } else if (userPath === 'ielts') {
    // Если выбрал IELTS — на IELTS дашборд
    window.location.replace('dashboard-ielts.html');
  }

  // Если залогинен, но путь не выбран — показываем модалку
  // Если нажмет на кнопку:
  function choosePath(path) {
    localStorage.setItem('user_path', path);
    if (path === 'english') {
      window.location.href = 'dashboard-english.html';
    } else {
      window.location.href = 'dashboard-ielts.html';
    }
  }
</script>
</body>
</html>
