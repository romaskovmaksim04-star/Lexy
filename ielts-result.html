<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("lang");if(l)document.documentElement.setAttribute("lang",l);}catch(e){}</script>
<title>Результат — GoLexi</title>
<link rel="stylesheet" href="golexi/fonts.css">
<link rel="stylesheet" href="golexi/app.css">
<style>:root{--font-unbounded:"Unbounded";--font-onest:"Onest"}html,body{margin:0}</style>
<script src="lexy-config.js?v=7"></script>
<script src="lexy-auth.js?v=13"></script>
</head>
<body>
<main class="mx-auto w-full max-w-5xl px-4 py-6 md:px-8 md:py-10">
  <div class="mb-6 flex flex-wrap items-center gap-3">
    <a href="dashboard-ielts.html#tests" class="btn btn-ghost btn-sm">← В кабинет</a>
    <a id="retry" href="dashboard-ielts.html#tests" class="text-sm font-bold text-fire-text">Пройти ещё раз</a>
    <a href="ielts-history.html" class="text-sm font-bold text-muted">История</a>
  </div>
  <div id="root"></div>
</main>
<script src="lexy-ielts-data.js?v=4"></script>
<script src="lexy-ielts-tasks.js?v=17"></script>
<script>
(function () {
  var id = (location.hash || "").replace(/^#\/?/, "");
  function local() { try { return JSON.parse(sessionStorage.getItem("lexy-attempt-" + id) || "null"); } catch (e) { return null; } }
  function fromTable() {
    return new Promise(function (resolve) {
      if (!(window.LexyAuth && LexyAuth.client)) return resolve(null);
      Promise.resolve(LexyAuth.token()).then(function (tk) {
        if (!tk) return resolve(null);
        return LexyAuth.client().from("lexy_attempts").select("id,section,task_id,band,details").eq("id", id).limit(1).then(function (r) {
          if (r.error || !r.data || !r.data.length) return resolve(null);
          var row = r.data[0], d = row.details || {};
          resolve(Object.assign({ id: row.id, section: row.section, taskId: row.task_id, band: row.band }, d));
        });
      }).catch(function () { resolve(null); });
    });
  }
  function render(a) {
    var root = document.getElementById("root");
    if (!a) { root.innerHTML = '<p class="text-muted">Результат не найден. <a href="dashboard-ielts.html#tests" class="text-fire-text font-bold">← К заданиям</a></p>'; return; }
    var label = { reading: "Reading", listening: "Listening", writing: "Writing", speaking: "Speaking" }[a.section] || "";
    var opts = {
      band: a.band, target: 7,
      label: label + ((a.section === "writing" || a.section === "speaking") ? "" : " · " + (a.correct || 0) + " из " + (a.total || 0)),
      items: a.items || [], text: a.text || "", model: a.model || "", parts: a.parts || [],
    };
    if (a.examiner) opts.examiner = a.examiner;
    var rt = document.getElementById("retry");
    if (rt && a.section && a.taskId) rt.setAttribute("href", "ielts-run.html#/" + a.section + "/" + a.taskId);
    if (window.IeltsTasks) window.IeltsTasks.mountResult(root, opts);
  }
  function run() { var a = local(); if (a) return render(a); fromTable().then(render); }
  if (document.readyState !== "loading") run(); else document.addEventListener("DOMContentLoaded", run);
})();
</script>
<script src="golexi-i18n.js?v=1"></script>
</body>
</html>
