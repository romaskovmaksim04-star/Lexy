<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("lang");if(l)document.documentElement.setAttribute("lang",l);}catch(e){}</script>
<title>Результат — GoLexi</title>
<link rel="stylesheet" href="golexi/fonts.css">
<link rel="stylesheet" href="golexi/app.css">
<style>:root{--font-unbounded:"Unbounded";--font-onest:"Onest"}html,body{margin:0}</style>
</head>
<body>
<main class="mx-auto w-full max-w-5xl px-4 py-6 md:px-8 md:py-10">
  <div class="mb-6 flex items-center gap-3">
    <a href="dashboard-ielts.html" class="btn btn-ghost btn-sm">← В кабинет</a>
    <a href="dashboard-ielts.html" class="text-sm font-bold text-fire-text">Пройти ещё раз</a>
  </div>
  <div id="root"></div>
</main>
<script src="lexy-ielts-data.js?v=1"></script>
<script src="lexy-ielts-tasks.js?v=12"></script>
<script>
(function () {
  function run() {
    var root = document.getElementById("root");
    var id = (location.hash || "").replace(/^#\/?/, "");
    var a = null;
    try { a = JSON.parse(sessionStorage.getItem("lexy-attempt-" + id) || "null"); } catch (e) {}
    if (!a) { root.innerHTML = '<p class="text-muted">Результат не найден. <a href="dashboard-ielts.html" class="text-fire-text font-bold">← К заданиям</a></p>'; return; }
    var label = { reading: "Reading", listening: "Listening", writing: "Writing", speaking: "Speaking" }[a.section] || "";
    var opts = { band: a.band, target: 7, label: label + (a.section === "writing" ? "" : " · " + (a.correct || 0) + " из " + (a.total || 0)), items: a.items || [] };
    if (a.examiner) opts.examiner = a.examiner;
    window.IeltsTasks.mountResult(root, opts);
  }
  if (document.readyState !== "loading") run(); else document.addEventListener("DOMContentLoaded", run);
})();
</script>
<script src="golexi-i18n.js?v=1"></script>
</body>
</html>
