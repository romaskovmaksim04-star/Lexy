<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("lang");if(l)document.documentElement.setAttribute("lang",l);}catch(e){}</script>
<title>Lexi — живой тренер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lexy-face.css?v=4">
<style>:root{--font-unbounded:"Unbounded";--font-onest:"Onest"}*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);font-family:var(--font-onest),system-ui,sans-serif;-webkit-font-smoothing:antialiased;margin:0}</style>
<link rel="stylesheet" href="lexy-dark.css?v=13">
<script src="lexy-config.js?v=7"></script>
<script src="lexy-auth.js?v=11"></script>
</head>
<body>
<main class="mx-auto w-full max-w-5xl px-4 py-6 md:px-8 md:py-10">
  <div class="mb-6"><a href="dashboard-ielts.html" class="btn btn-ghost btn-sm">← В кабинет</a></div>
  <div id="lexi-root"></div>
</main>
<script src="lexy-lexi.js?v=4"></script>
<script src="lexy-theme.js?v=2"></script>
<script>
(function () {
  function m() { var el = document.getElementById("lexi-root"); if (el && window.LexiApp) window.LexiApp.mount(el); }
  if (document.readyState !== "loading") m(); else document.addEventListener("DOMContentLoaded", m);
})();
</script>
</body>
</html>
