  /* ---------- КАРТА КУРСА ---------- */
  var mapView = "course";
  function renderCourse() {
    injectDsh();
    var el = $("#s-path"), c = course(), cur = currentDayFor(c.level), total = C.totalDays(c.level);
    var levelDone = 0; for (var i = 1; i <= total; i++) if (isDone(c.level, i)) levelDone++;
    var pct = Math.round(levelDone / total * 100);
    var seg = '<div class="seg"><button class="' + (mapView === "course" ? "on" : "") + '" data-view="course">' + T("course") + '</button><button class="' + (mapView === "theory" ? "on" : "") + '" data-view="theory">' + T("theory") + '</button><button class="' + (mapView === "history" ? "on" : "") + '" data-view="history">' + T("history") + "</button></div>";
    var hero = '<div class="hx"><div class="lvbox"><span class="lvchip">' + c.level + '</span><div><h2 class="lvname">' + lvName(c.level, 0) + '</h2><p class="lvdesc">' + esc(C.levelDesc(c.level, lang())) + '</p></div></div>' +
      '<div class="lvrow"><span>' + T("lessonsDone") + ": <b>" + levelDone + " / " + total + '</b></span><button class="btn ghost sm" data-change>' + ic("swap") + " " + T("change") + '</button></div>' + '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
    var content;
    if (mapView === "theory") content = theoryBlock(c.level);
    else if (mapView === "history") content = histBlock();
    else content = daysList(cur) + testCard(levelDone, total) + (!paid() ? '<div class="card free">' + T("free") + "</div>" : "");
    el.innerHTML = hero + seg + content;
  }

  function daysList(cur) {
    var c = course(), total = C.totalDays(c.level), h = "";
    for (var d = 1; d <= total; d++) {
      var done = isDone(c.level, d), acc = canAccess(c.level, d), current = d === cur;
      var st = done ? "done" : current ? "cur" : acc ? "" : "lock";
      if (!acc && !done) st += " blurrow";
      var badge = done ? "✓" : current ? T("nowT") : "";
      var sub = done ? T("doneT") : current ? T("nowT") : acc ? "" : T("lockT");
      var last = c.done[c.level + "-" + d], meta = "", bd = "";
      if (last && last.last) {
        var okn = last.last.correct, badn = Math.max(0, (last.last.total || 0) - okn);
        meta = '<span class="dok">✓ ' + okn + '</span><span class="dbad">✗ ' + badn + "</span>";
        bd = '<span class="dbd" data-bd="' + d + '">' + BTt() + "</span>";
      }
      h += '<div class="drow ' + st + '" data-day="' + d + '" role="button" tabindex="0" style="animation-delay:' + (Math.min(d, 14) * 0.04).toFixed(2) + 's"><span class="dn">' + d + '</span><span class="dtx"><b>' + esc(C.lessonTitle(c.level, d, lang())) + '</b><small>' + sub + '</small></span><span class="dmeta">' + meta + '</span><span class="dbadge">' + badge + "</span>" + bd + "</div>";
    }
    return '<div class="dlist">' + h + "</div>";
  }

  function openBreakdown(level, day) {
    var rec = course().done[level + "-" + day];
    if (!rec || !rec.last) return;
    var l = rec.last, ms = l.mistakes || [], en = lang() === "en";
    var head = '<div class="bdrow"><span>' + T("yourScore") + ': <b>' + l.correct + " / " + l.total + '</b></span></div>';
    var list = ms.length
      ? ms.map(function (m) { return '<div class="bdm"><div class="bdq">' + esc(m.q) + '</div><div class="bda"><span class="bdno">✗ ' + esc(m.your) + '</span><span class="bdok2">✓ ' + esc(m.correct) + "</span></div></div>"; }).join("")
      : '<div class="bdnone">' + (en ? "No mistakes — great job! 🎉" : "Ошибок нет — отлично! 🎉") + "</div>";
    Lexy.modal({ title: BTt() + " · " + T("dayTitle") + " " + day, body: head + list, ok: (en ? "Retake" : "Пройти заново"), cancel: (en ? "Close" : "Закрыть"), onOk: function () { openDay(day); } });
  }

  function testCard(done, total) {
    var all = done >= total;
    return '<div class="card testcard"><div class="tcent"><span class="bic">' + ic("file") + '</span><div><b>' + T("testTitle") + " " + course().level + "</b><small>" + (all ? T("testAll") : T("testHint")) + "</small></div></div>" +
      '<button class="btn p big" id="mtest">' + ic("play") + " " + T("testBtn") + "</button></div>";
  }

  function theoryBlock(level) {
    var LS = (window.LEXY_LESSONS && LEXY_LESSONS[level]) || [];
    if (!LS.length) return '<div class="card"><b>' + T("theoryT") + '</b><p class="s">—</p></div>';
    return LS.map(function (l, i) {
      var day = i + 1, info = accessInfo(level, day), tt = C.theory(level, day, lang());
      return '<div class="card tcard' + (info ? " blurred" : "") + '" data-tday="' + day + '" style="animation-delay:' + (Math.min(i, 14) * 0.04).toFixed(2) + 's"><span class="tnum">' + day + '</span><div class="tbody">' +
        '<div class="btitle" style="font-size:17px">' + esc(tt.t) + '</div><p>' + esc(tt.e) + '</p>' +
        '<div class="exlist" data-ex hidden>' + tt.ex.map(function (x) { return "<div>" + esc(x) + "</div>"; }).join("") + "</div>" +
        '<div class="tsug">' + T("theoryTip") + '</div>' +
        (info ? "" : '<div class="trow"><button class="btn ghost sm" data-tex>' + T("readMore") + '</button><button class="btn p sm" data-tlesson>' + T("openLesson") + '</button></div>') + "</div></div>";
    }).join("");
  }

  function histBlock() {
    if (!paid()) return '<div class="card lockcard"><b>' + T("histTitle") + '</b><p class="s">' + T("histLock") + '</p><a class="btn p sm" href="pricing.html" style="margin-top:10px">Premium</a></div>';
    var c = course();
    var keys = Object.keys(c.done).sort(function (a, b) { return (c.done[b].date || 0) - (c.done[a].date || 0); });
    if (!keys.length) return '<div class="card"><b>' + T("histTitle") + '</b><p class="s" style="margin-top:6px">' + T("histEmpty") + "</p></div>";
    return '<div class="card"><div style="font:800 18px var(--display);margin-bottom:8px">' + T("histTitle") + "</div>" +
      keys.slice(0, 40).map(function (k) { var d = c.done[k], p = k.split("-"); return '<div class="rw"><div><b>' + p[0] + " · " + T("dayTitle") + " " + p[1] + '</b><small>' + new Date(d.date).toLocaleDateString(lang() === "en" ? "en-GB" : "ru-RU", { day: "numeric", month: "long" }) + '</small></div><span class="nt" style="color:var(--ok);font-weight:700">' + (d.score != null ? d.score + "%" : "✓") + "</span></div>"; }).join("") + "</div>";
  }

  function changeLevelModal() {
    var c = course();
    Lexy.modal({ title: T("change"), body: '<div class="ol">' + LEVELS.map(function (l) { return '<button class="op' + (c.level === l[0] ? " on" : "") + '" data-pick="' + l[0] + '"><span class="lb2">' + l[0] + '</span><div>' + lvName(l[0], 0) + "<small>" + lvName(l[0], 1) + "</small></div></button>"; }).join("") + "</div>", foot: false });
    document.querySelectorAll("#mv [data-pick]").forEach(function (b) { b.addEventListener("click", function () { var cc = course(); cc.level = b.dataset.pick; Lexy.save({ course: cc }); Lexy.close(); renderCourse(); }); });
  }

  var TQ = null, TT = null;
  function runModuleTest() {
    var c = course(), d = C.moduleTest(c.level);
    RUN = { plan: { level: c.level, day: "test", isTest: true, title: T("testTitle") }, i: 0, results: [], mistakes: [], ansTotal: 0, ansWrong: 0 };
    TQ = null;
    drawTestIntro(d);
  }
  function drawTestIntro(d) {
    var el = $("#s-path");
    el.innerHTML = '<div class="crun-top"><button class="lnk" id="back">← ' + T("stay") + '</button></div>' +
      '<div class="block"><div class="bhead"><span class="bic">' + ic("file") + '</span><div><div class="btitle">' + T("testTitle") + " · " + course().level + '</div><div class="bsub">' + T("testIntroSub") + '</div></div></div>' +
      '<div class="tmeta"><div><b>' + d.questions.length + '</b><small>' + T("questions") + '</small></div><div><b>85%</b><small>' + T("toNext") + '</small></div><div><b>∞</b><small>' + T("noLimit") + '</small></div></div>' +
      '<div class="tip">' + T("testTip") + '</div>' +
      '<button class="btn p big" id="tstart" style="margin-top:16px">' + ic("play") + " " + T("startTest") + '</button></div>';
    $("#back").addEventListener("click", renderCourse);
    $("#tstart").addEventListener("click", function () { TQ = { list: d.questions, i: 0, score: 0, answered: false, picked: null, opts: null, correct: 0, t0: Date.now() }; startTimer(); renderTestQ(); });
  }
  function startTimer() {
    if (TT) clearInterval(TT);
    TT = setInterval(function () { var el = $("#tmr"); if (!el || !el.isConnected) return; var s = Math.floor((Date.now() - TQ.t0) / 1000); el.textContent = Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }, 500);
  }
  function renderTestQ() {
    var el = $("#s-path"), q = TQ.list[TQ.i];
    var mapped = shuffle((q.o || []).map(function (o, x) { return { o: o, c: x === q.a }; }));
    TQ.correct = mapped.findIndex(function (x) { return x.c; }); TQ.opts = mapped; TQ.answered = false; TQ.picked = null;
    var pct = Math.round(TQ.i / TQ.list.length * 100);
    el.innerHTML = '<div class="testbar"><span class="tmrwrap">' + ic("clock") + ' <b id="tmr">0:00</b></span><span class="qcnt">' + (TQ.i + 1) + " / " + TQ.list.length + '</span></div>' +
      '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
      '<div class="block"><div class="bhead"><span class="bic">' + ic(q.listen ? "head" : "file") + '</span><div><div class="btitle">' + (q.listen ? T("audio") : T("question")) + " " + (TQ.i + 1) + '</div><div class="bsub">' + esc(course().level) + '</div></div></div>' +
      (q.listen ? '<div class="player"><button class="pbtn" id="tplay">' + ic("play") + '</button><div class="ptx"><b>' + T("audio") + '</b><small>' + T("audio") + '</small></div></div><audio id="tau" preload="none" src="' + C.audioFor(q.listen) + '"></audio>' : "") +
      '<div class="qtext">' + esc(q.q) + '</div><div class="opts">' +
      mapped.map(function (o, x) { return '<button class="opt" data-x="' + x + '"><span class="key">' + "ABCD"[x] + "</span>" + esc(o.o) + "</button>"; }).join("") + "</div>" +
      '<button class="btn p big" id="nq" disabled style="margin-top:16px">' + T("answer") + '</button></div>';
    if (q.listen) {
      var pb = $("#tplay"), au = $("#tau");
      if (au) au.addEventListener("error", function () { au.dataset.fail = "1"; });
      if (pb) pb.addEventListener("click", function () { if (au && !au.dataset.fail) { try { var pr = au.play(); if (pr && pr.catch) pr.catch(function () { speak(q.listen, pb); }); } catch (e) { speak(q.listen, pb); } } else speak(q.listen, pb); });
    }
    el.querySelectorAll(".opt").forEach(function (b) { b.addEventListener("click", function () { if (TQ.answered) return; el.querySelectorAll(".opt").forEach(function (x) { x.classList.remove("on"); }); b.classList.add("on"); TQ.picked = +b.dataset.x; $("#nq").disabled = false; }); });
    $("#nq").addEventListener("click", function () {
      if (TQ.picked == null) return;
      if (!TQ.answered) { TQ.answered = true; var all = el.querySelectorAll(".opt"); all[TQ.correct].classList.add("right"); if (TQ.picked !== TQ.correct) all[TQ.picked].classList.add("wrong"); else TQ.score++; $("#nq").textContent = TQ.i === TQ.list.length - 1 ? T("finish") + " →" : T("next") + " →"; }
      else { TQ.i++; if (TQ.i < TQ.list.length) renderTestQ(); else completeTest(); }
    });
  }
  function completeTest() {
    if (TT) { clearInterval(TT); TT = null; }
    RUN.results = [Math.round(TQ.score / TQ.list.length * 100)];
    RUN.t0 = TQ.t0;
    RUN.extra = { correct: TQ.score, total: TQ.list.length };
    finishDay();
  }
  function ringSvg(pct) { var r = 52, cc = 2 * Math.PI * r, off = cc * (1 - pct / 100); return '<svg viewBox="0 0 120 120" class="ring2"><circle cx="60" cy="60" r="' + r + '" class="bgc"/><circle cx="60" cy="60" r="' + r + '" class="fgc" data-off="' + off.toFixed(1) + '" style="stroke-dasharray:' + cc.toFixed(1) + ";stroke-dashoffset:" + cc.toFixed(1) + '"/></svg>'; }

  $("#s-path").addEventListener("click", function (e) {
    var v = e.target.closest("[data-view]"); if (v) { mapView = v.dataset.view; renderCourse(); return; }
    if (e.target.closest("#mtest")) { runModuleTest(); return; }
    if (e.target.closest("[data-change]")) { changeLevelModal(); return; }
    var lv = course().level;
    var tc = e.target.closest(".tcard");
    if (tc) { var dd = +tc.dataset.tday, ii = accessInfo(lv, dd); if (ii) { lockModal(lv, dd, ii); return; } }
    var tex = e.target.closest("[data-tex]");
    if (tex) { var card = tex.closest(".tcard"), ex = card.querySelector("[data-ex]"); ex.hidden = !ex.hidden; tex.textContent = ex.hidden ? T("readMore") : T("hideExamples"); return; }
    var tl = e.target.closest("[data-tlesson]");
    if (tl) { var d1 = +tl.closest(".tcard").dataset.tday, i1 = accessInfo(lv, d1); if (i1) { lockModal(lv, d1, i1); return; } openDay(d1); return; }
    var bd = e.target.closest("[data-bd]");
    if (bd) { openBreakdown(course().level, +bd.dataset.bd); return; }
    var d = e.target.closest("[data-day]"); if (d) { var day = +d.dataset.day, info = accessInfo(lv, day); if (info) { lockModal(lv, day, info); return; } openDay(day); }
  });

  function upsellDay() {
    Lexy.modal({ title: "Premium", body: "<p>" + T("free") + "</p>", ok: "Premium", cancel: T("stay"), onOk: function () { location.href = "pricing.html"; return false; } });
  }

  /* ---------- ПРОХОЖДЕНИЕ УРОКА ---------- */
  var RUN = null;
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function blockLabel(B) { return B.type === "theory" ? T("theoryT") : B.type === "listening" ? T("audio") : B.type === "test" ? T("testTitle") : (B.data && B.data.kind === "words") ? T("words") : (B.data && B.data.kind === "grammar") ? T("grammar") : T("practice"); }

  function openDay(day) {
    var c = course(), plan = C.plan(c.level, day), key = c.level + "-" + day;
    var start = (c.prog && c.prog[key] && c.prog[key].i) || 0;
    if (start >= plan.blocks.length) start = 0;
    RUN = { plan: plan, i: start, results: [], mistakes: [], ansTotal: 0, ansWrong: 0 };
    drawBlock();
  }
  function drawBlock() {
    var el = $("#s-path");
    if (RUN.i >= RUN.plan.blocks.length) { finishDay(); return; }
    var cc = course(); cc.prog[RUN.plan.level + "-" + RUN.plan.day] = { i: RUN.i, ts: Date.now() }; Lexy.save({ course: cc });
    var B = RUN.plan.blocks[RUN.i];
    var dots = RUN.plan.blocks.map(function (x, idx) { return '<i class="' + (idx < RUN.i ? "done" : idx === RUN.i ? "on" : "") + '"></i>'; }).join("");
    var title = '<div class="crun-top"><button class="lnk" id="back">← ' + T("stay") + '</button><span class="lk">' + esc(RUN.plan.title || "") + '</span></div>';
    var body = B.type === "theory" ? drawTheory(B.data) : B.type === "listening" ? drawListening(B.data) : B.type === "test" ? drawTest(B.data) : B.type === "order" ? drawOrder(B.data) : B.type === "typing" ? drawTyping(B.data) : B.type === "match" ? drawMatch(B.data) : B.type === "quiz" ? drawQuiz(B.data) : drawTheory(B.data);
    el.innerHTML = title + '<div class="dots">' + dots + "</div>" + body;
    $("#back").addEventListener("click", renderCourse);
    if (B.type === "theory") $("#bnext").addEventListener("click", function () { nextBlock(1); });
    else if (B.type === "listening") wireQuiz(el, B.data, true);
    else if (B.type === "test") wireTest(el, B.data);
    else if (B.type === "order") wireOrder(el, B.data);
    else if (B.type === "typing") wireTyping(el, B.data);
    else if (B.type === "match") wireMatch(el, B.data);
    else if (B.type === "quiz") wireQuiz(el, B.data, false);
  }
  function nextBlock(score) { RUN.results.push(score || 0); RUN.i++; drawBlock(); }

  function drawTheory(d) {
    var tt = (C.theory && (d.level || RUN.plan.level)) ? C.theory(d.level || RUN.plan.level, d.day || RUN.plan.day, lang()) : d;
    tt = tt || d;
    return '<div class="block"><div class="bhead"><span class="bic">' + ic("book") + '</span><div><div class="btitle">' + esc(tt.t) + '</div><div class="bsub">' + T("theoryT") + '</div></div></div>' +
      '<div class="lesson"><p>' + esc(tt.e) + "</p></div>" +
      '<div class="exlist">' + (tt.ex || []).map(function (x) { return "<div>" + esc(x) + "</div>"; }).join("") + "</div>" +
      '<button class="btn p big" id="bnext" style="margin-top:18px">' + T("next") + " →</button></div>";
  }
  function drawListening(d) {
    var url = C.audioFor(d.script);
    var sub = esc(C.lessonTitle(RUN.plan.level, RUN.plan.day, lang()));
    return '<div class="block"><div class="bhead"><span class="bic">' + ic("head") + '</span><div><div class="btitle">' + T("audio") + '</div><div class="bsub">' + sub + '</div></div></div>' +
      '<div class="player"><button class="pbtn" id="play">' + ic("play") + '</button><div class="ptx"><b>' + T("audio") + '</b><small>' + T("audio") + "</small></div></div>" + (url ? '<audio id="au" preload="none" src="' + url + '"></audio>' : "") +
      '<button class="btn ghost sm trbtn" id="showtr">' + T("theoryT") + "</button>" + '<div id="tr" hidden class="readpg" style="margin-top:10px">' + esc(d.script) + "</div>" +
      '<div id="qarea" style="margin-top:16px"></div></div>';
  }
  function drawQuiz(d) {
    var sub = esc(C.lessonTitle(RUN.plan.level, RUN.plan.day, lang()));
    return '<div class="block"><div class="bhead"><span class="bic">' + ic(d.kind === "words" ? "vocab" : d.kind === "grammar" ? "book" : "spark") + '</span><div><div class="btitle">' + T(d.kind === "words" ? "words" : d.kind === "grammar" ? "grammar" : "practice") + '</div><div class="bsub">' + sub + '</div></div></div><div id="qarea"></div></div>';
  }
  function drawTest(d) { return '<div class="block"><div class="bhead"><span class="bic">' + ic("file") + '</span><div><div class="btitle">' + esc(d.title) + '</div><div class="bsub" id="tmr"></div></div></div><div id="qarea"></div></div>'; }

  /* ---------- НОВЫЕ ТИПЫ ЗАДАНИЙ ---------- */
  var NTXT = {
    ru: { orderT: "Собери предложение", orderHint: "Нажимай на слова по порядку", typeT: "Переведи слово", typeHint: "Напиши перевод по-русски", ph: "Перевод…", matchT: "Найди пару", matchHint: "Соедини слово и перевод", check: "Проверить", correct: "Верно!", wrong: "Неверно", answerWas: "Правильный ответ:", nextW: "Дальше" },

      var p = Math.min(1, (t - t0) / dur);

      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
