<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lexy — Английский</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lexy.css">
<script src="lexy-config.js?v=7"></script>
<script src="lexy-auth.js?v=9"></script>
<script src="lexy-core.js?v=12"></script>
<script src="lexy-pay.js?v=7"></script>
<script src="lexy-content.js?v=1"></script>
<script src="lexy-course-extra.js?v=1"></script>
<script src="lexy-course.js?v=2"></script>
<script src="lexy-vocab.js?v=1"></script>
</head>
<body>
<script>Lexy.guard("english");</script>
<script>if(window.LexyPay) LexyPay.handleReturn();</script>

<main class="main">
  <section class="sec" id="s-path"></section>
  <section class="sec" id="s-practice"></section>
  <section class="sec" id="s-talk">
    <h1 class="t">Разговор</h1>
    <div data-gate="ai"></div>
    <div data-pro="ai" hidden>
      <div class="card" style="margin-top:20px">
        <h3 style="font:800 20px var(--display);letter-spacing:-.02em">Чат с Lexy AI</h3>
        <p class="s">Выбери характер собеседника и говори. Пока тренируйся в игре Shadow Speak, пока чат в разработке.</p>
        <a class="btn v" href="game-shadow.html">Открыть Shadow Speak</a>
      </div>
    </div>
  </section>
  <section class="sec" id="s-vocab"></section>
  <section class="sec" id="s-progress"></section>
  <section class="sec" id="s-profile"></section>
</main>

<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = Lexy.esc, ic = Lexy.ic, fl = Lexy.fl, C = window.LexyCourse;
  var paid = function () { return !!(Lexy.user && Lexy.user.premium); };

  var GOALS = C.GOALS;
  var LEVELS = [
    ["A1", "Начинающий", "Знаю отдельные слова"],
    ["A2", "Элементарный", "Строю простые фразы"],
    ["B1", "Средний", "Объясняюсь, но с трудом"],
    ["B2", "Выше среднего", "Говорю с ошибками, но свободно"],
    ["C1", "Продвинутый", "Хочу отшлифовать речь"]
  ];
  var sel = { goal: null, level: null };

  function dayWord(n) { var a = n % 10, b = n % 100; return a === 1 && b !== 11 ? "день" : (a >= 2 && a <= 4 && (b < 10 || b >= 20)) ? "дня" : "дней"; }
  function levelTitle(l) { return C.LEVEL_TITLE[l] || l; }

  /* ---------- КУРС: состояние ---------- */
  function course() {
    var u = Lexy.user;
    if (!u.course) u.course = { level: (u.onboard && (u.onboard.level || u.onboard.l)) || "A1", day: 1, startLevel: (u.onboard && (u.onboard.level || u.onboard.l)) || "A1", done: {}, passes: {} };
    if (!u.course.done) u.course.done = {};
    if (!u.course.passes) u.course.passes = {};
    return u.course;
  }
  function isDone(level, day) { return !!course().done[level + "-" + day]; }
  function currentDay() {
    var c = course(), d = 1;
    while (d <= C.totalDays && isDone(c.level, d)) d++;
    return d > C.totalDays ? C.totalDays : d;
  }
  function canAccess(level, day) { return C.isFree(level, day, paid(), course().startLevel); }

  /* ---------- ОНБОРДИНГ (цель + уровень) ---------- */
  function renderOnboard() {
    var el = $("#s-path");
    var head = '<div class="top"><h1 class="t">Привет' + (Lexy.user.name ? ", " + esc(Lexy.user.name) : "") + '!</h1></div>';
    el.innerHTML = head + '<div class="card ob"><h3>Соберём твой курс за 2 шага</h3><p class="sb">Никаких тем — только цель и уровень. Дальше Lexy сам составит 90 дней по 5 блоков в день.</p>' +
      "<h4>Зачем тебе английский?</h4><div class=\"og\">" + GOALS.map(function (g) { return '<button class="op' + (sel.goal === g.id ? " on" : "") + '" data-goal="' + g.id + '"><span class="em">' + ({ study: "🎓", travel: "✈️", work: "💼", move: "🏠" }[g.id] || "•") + "</span>" + g.t + "</button>"; }).join("") + "</div>" +
      "<h4>Какой у тебя уровень английского сейчас?</h4><div class=\"ol\">" + LEVELS.map(function (l) { return '<button class="op' + (sel.level === l[0] ? " on" : "") + '" data-level="' + l[0] + '"><span class="lb2">' + l[0] + "</span><div>" + l[1] + "<small>" + l[2] + "</small></div></button>"; }).join("") + "</div>" +
      '<button class="btn p" id="obgo"' + (sel.goal && sel.level ? "" : " disabled") + ">Собрать курс</button></div>";
  }
  $("#s-path").addEventListener("click", function (e) {
    var g = e.target.closest("[data-goal]"), l = e.target.closest("[data-level]");
    if (g) { sel.goal = g.dataset.goal; document.querySelectorAll("[data-goal]").forEach(function (x) { x.classList.toggle("on", x === g); }); $("#obgo").disabled = !(sel.goal && sel.level); return; }
    if (l) { sel.level = l.dataset.level; document.querySelectorAll("[data-level]").forEach(function (x) { x.classList.toggle("on", x === l); }); $("#obgo").disabled = !(sel.goal && sel.level); return; }
    if (e.target.closest("#obgo")) {
      var u = Lexy.user;
      Lexy.save({ onboard: { goal: sel.goal, level: sel.level }, course: { level: sel.level, startLevel: sel.level, day: 1, done: {}, passes: {} } });
      Lexy.toast("Курс собран! День 1 ждёт тебя.");
      openDay(1);
    }
  });

  /* ---------- КАРТА КУРСА ---------- */
  function renderCourse() {
    var el = $("#s-path"), c = course(), cur = currentDay();
    var doneCount = Object.keys(c.done).length;
    var levelDays = 0; for (var i = 1; i <= C.totalDays; i++) if (isDone(c.level, i)) levelDays++;
    var pct = Math.round(levelDays / C.totalDays * 100);
    var goal = (Lexy.user.onboard && Lexy.user.onboard.goal) || (Lexy.user.onboard && Lexy.user.onboard.g) || "study";
    var goalName = (GOALS.filter(function (g) { return g.id === goal; })[0] || {}).t || "Учёба";

    var head = '<div class="top"><h1 class="t">Курс английского</h1></div>';
    el.innerHTML = head +
      '<div class="pth"><div class="hero"><h2>' + c.level + " · " + levelTitle(c.level) + "</h2><p>Цель: " + esc(goalName) + " · уроков пройдено: " + doneCount + '</p><div class="bar"><i style="width:' + pct + '%"></i></div>' +
      (cur > C.totalDays ? "<b>Курс уровня пройден 🎉</b>" : '<button class="btn" id="cont">' + ic("play") + " Продолжить: день " + cur + " (" + (C.isTestDay(cur) ? "тест уровня" : "5 блоков") + ")</button>") +
      '<a class="lnk" href="#profile" data-goal="change">Сменить цель/уровень</a></div>' +
      '<div class="days">' + grid(cur) + "</div>" +
      (!paid() ? '<div class="card" style="margin-top:16px"><b>Бесплатно:</b> первые ' + C.FREE_DAYS + " дня вводного уровня. Полный курс (90 дней × 5 блоков, тесты каждые 7 дней) — в <a href=\"pricing.html\" style=\"color:var(--fire);font-weight:700\">тарифах</a>.</div>" : "") +
      histBlock() +
      '</div>';

    $("#cont") && $("#cont").addEventListener("click", function () { openDay(cur); });
  }

  function grid(cur) {
    var c = course(), h = "";
    for (var d = 1; d <= C.totalDays; d++) {
      var test = C.isTestDay(d), done = isDone(c.level, d), locked = !canAccess(c.level, d);
      var cls = "dcard" + (test ? " test" : "") + (done ? " done" : "") + (locked ? " lock" : "") + (d === cur ? " cur" : "");
      h += '<button class="' + cls + '" data-day="' + d + '"><b>' + d + "</b><small>" + (test ? "тест" : "5") + "</small></button>";
    }
    return h;
  }

  $("#s-path").addEventListener("click", function (e) {
    var d = e.target.closest("[data-day]");
    if (d) { var day = +d.dataset.day; if (!canAccess(course().level, day)) { Lexy.upsell && upsellDay(); return; } openDay(day); return; }
    var g = e.target.closest("[data-goal='change']");
    if (g) { Lexy.save({ onboard: null, course: null }); sel = { goal: null, level: null }; renderOnboard(); }
  });

  function histBlock() {
    var c = course();
    var keys = Object.keys(c.done).sort(function (a, b) { return (c.done[b].date || 0) - (c.done[a].date || 0); });
    if (!keys.length) return '<div class="card" style="margin-top:16px"><b>История прохождения</b><p class="s" style="margin-top:6px">Пока пусто. Пройди первый день — здесь появится история с результатами (доступна бесплатно).</p></div>';
    return '<div class="card" style="margin-top:16px"><div style="font:800 18px var(--display);margin-bottom:8px">История прохождения</div>' +
      keys.slice(0, 30).map(function (k) {
        var d = c.done[k], p = k.split("-");
        return '<div class="rw"><div><b>' + p[0] + " · день " + p[1] + '</b><small>' + new Date(d.date).toLocaleDateString("ru-RU", { day: "numeric", month: "long" }) + '</small></div><span class="nt" style="color:var(--ok);font-weight:700">' + (d.score != null ? d.score + "%" : "✓") + "</span></div>";
      }).join("") + "</div>";
  }

  function upsellDay() {
    Lexy.modal({ title: "Доступно в Premium", body: "<p>Бесплатно открыто только первые " + C.FREE_DAYS + " дня вводного уровня. Чтобы открыть весь курс (90 дней, тесты, уровни A1–C1) — оформи Premium.</p>", ok: "Получить Premium", cancel: "Позже", onOk: function () { location.href = "pricing.html"; return false; } });
  }

  /* ---------- ПРОХОЖДЕНИЕ ДНЯ ---------- */
  var RUN = null;
  function openDay(day) {
    var c = course(), plan = C.plan(c.level, day);
    var key = c.level + "-" + day;
    var start = (c.prog && c.prog[key] && c.prog[key].i) || 0;
    if (start >= plan.blocks.length) start = 0;
    RUN = { plan: plan, i: start, results: [] };
    drawBlock();
  }
  function drawBlock() {
    var el = $("#s-path");
    if (RUN.i >= RUN.plan.blocks.length) { finishDay(); return; }
    // сохраняем место, где остановились — при возврате продолжим отсюда
    var cc = course(); if (!cc.prog) cc.prog = {};
    cc.prog[RUN.plan.level + "-" + RUN.plan.day] = { i: RUN.i, ts: Date.now() };
    Lexy.save({ course: cc });
    var B = RUN.plan.blocks[RUN.i];
    var dots = RUN.plan.blocks.map(function (x, idx) { return '<i class="' + (idx < RUN.i ? "done" : idx === RUN.i ? "on" : "") + '"></i>'; }).join("");
    var title = '<div class="crun-top"><button class="lnk" id="back">← К карте</button><span class="lk">' + esc(RUN.plan.title) + " · " + C.blockLabel(B.type) + "</span></div>";
    var stepbar = '<div class="dots">' + dots + "</div>";
    var body = "";
    if (B.type === "theory") body = drawTheory(B.data);
    else if (B.type === "vocab") body = drawVocab(B.data);
    else if (B.type === "listening") body = drawQuiz(B.data, "listening");
    else if (B.type === "reading") body = drawReading(B.data);
    else if (B.type === "speaking") body = drawSpeaking(B.data);
    else if (B.type === "quiz") body = drawQuiz(B.data, "quiz");
    else if (B.type === "test") body = drawTest(B.data);
    el.innerHTML = title + stepbar + body;

    $("#back").addEventListener("click", renderCourse);
    if (B.type === "theory") wireTheory(el);
    else if (B.type === "vocab") wireVocab(el);
    else if (B.type === "reading" || B.type === "listening" || B.type === "quiz") wireQuiz(el, B.data, B.type);
    else if (B.type === "speaking") wireSpeaking(el);
    else if (B.type === "test") wireTest(el);
  }

  function drawTheory(d) {
    return '<div class="block"><div class="bhead"><span class="bic">' + ic("book") + '</span><div><div class="btitle">' + esc(d.t) + '</div><div class="bsub">Практика с объяснением · разбор правила</div></div></div>' +
      '<div class="lesson"><p>' + esc(d.e) + "</p></div>" +
      '<div class="exlist">' + (d.ex || []).map(function (x) { return "<div>" + esc(x) + "</div>"; }).join("") + "</div>" +
      '<div class="tip">💡 Прочитай примеры вслух — так правило запоминается быстрее.</div>' +
      '<button class="btn p" id="bnext" style="margin-top:16px;width:100%">Понятно, к заданиям →</button></div>';
  }
  function wireTheory(el) { var b = $("#bnext", el); b && b.addEventListener("click", function () { nextBlock(1); }); }
  function nextBlock(score) { RUN.results.push(score || 0); RUN.i++; drawBlock(); }

  function drawVocab(d) {
    return '<div class="block"><div class="bhead"><span class="bic">' + ic("vocab") + '</span><div><div class="btitle">Слова · ' + esc(d.t) + '</div><div class="bsub">Отметь ✓ слова, которые уже знаешь</div></div></div>' +
      '<div class="wcards">' + d.w.map(function (x) { return '<div class="wcard"><div><div class="wbig">' + esc(x[0]) + '</div><div class="wt">' + esc(x[1]) + '</div></div><button class="kbtn" data-know aria-label="знаю">' + ic("check") + "</button></div>"; }).join("") + "</div>" +
      '<button class="btn p" id="bnext" style="margin-top:16px;width:100%">Дальше →</button></div>';
  }
  function wireVocab(el) {
    el.querySelectorAll("[data-know]").forEach(function (b) { b.addEventListener("click", function () { b.classList.toggle("on"); }); });
    $("#bnext").addEventListener("click", function () { nextBlock(1); });
  }

  function drawReading(d) {
    return '<div class="block"><div class="bhead"><span class="bic">' + ic("book") + '</span><div><div class="btitle">' + esc(d.t) + '</div><div class="bsub">Чтение и грамматика · прочитай и ответь</div></div></div>' +
      '<div class="readpg">' + esc(d.p) + '</div><div id="qarea" style="margin-top:18px"></div></div>';
  }
  function drawQuiz(d, type) {
    var url = type === "listening" && C.audioFor ? C.audioFor(d.script) : null;
    var head = '<div class="bhead"><span class="bic">' + ic(type === "listening" ? "head" : "spark") + '</span><div><div class="btitle">' + esc(d.t) + '</div><div class="bsub">' + (type === "listening" ? "Аудирование · послушай и ответь" : "Практика · выбери верный ответ") + "</div></div></div>";
    var player = "";
    if (type === "listening") {
      player = '<div class="player"><button class="pbtn" id="play">' + ic("play") + '</button><div class="ptx"><b>Прослушай запись</b><small>Нажми на кнопку, чтобы включить</small></div></div>' +
        (url ? '<audio id="au" preload="none" src="' + url + '"></audio>' : "") +
        '<button class="btn ghost sm trbtn" id="showtr">Показать текст</button><div id="tr" hidden class="readpg" style="margin-top:10px">' + esc(d.script) + "</div>";
    }
    return '<div class="block">' + head + player + '<div id="qarea" style="margin-top:16px"></div></div>';
  }
  function wireQuiz(el, d, type) {
    if (type === "listening") {
      var pb = $("#play"), au = $("#au");
      if (au) au.addEventListener("error", function () { au.dataset.fail = "1"; });
      if (pb) pb.addEventListener("click", function () {
        if (au && !au.dataset.fail) {
          try { var pr = au.play(); if (pr && pr.catch) pr.catch(function () { speak(d.script, pb); }); }
          catch (e) { speak(d.script, pb); }
        } else { speak(d.script, pb); }
      });
      var trb = $("#showtr", el), tr = $("#tr", el);
      if (trb && tr) trb.addEventListener("click", function () { tr.hidden = !tr.hidden; trb.textContent = tr.hidden ? "Показать текст" : "Скрыть текст"; });
    }
    var list = d.q || d.questions, i = 0, score = 0, answered = false, picked = null;
    function draw() {
      var q = list[i];
      $("#qarea").innerHTML = '<div class="qmeta"><span>Вопрос ' + (i + 1) + " из " + list.length + '</span></div><div class="qtext">' + esc(q.q) + '</div><div class="opts">' +
        q.o.map(function (o, x) { return '<button class="opt" data-x="' + x + '"><span class="key">' + "ABCD"[x] + "</span>" + esc(o) + "</button>"; }).join("") + "</div>" +
        '<button class="btn" id="nq" disabled style="margin-top:14px">Далее →</button>';
      picked = null; answered = false;
      $("#qarea").querySelectorAll(".opt").forEach(function (b) {
        b.addEventListener("click", function () {
          if (answered) return;
          $("#qarea").querySelectorAll(".opt").forEach(function (x) { x.classList.remove("on"); });
          b.classList.add("on"); picked = +b.dataset.x; $("#nq").disabled = false;
        });
      });
      $("#nq").addEventListener("click", function () {
        if (picked == null) return;
        if (!answered) {
          answered = true;
          var opts = $("#qarea").querySelectorAll(".opt");
          opts[q.a].classList.add("right");
          if (picked !== q.a) opts[picked].classList.add("wrong"); else score++;
          $("#nq").textContent = i === list.length - 1 ? "Готово →" : "Следующий →";
        } else { i++; if (i < list.length) draw(); else nextBlock(Math.round(score / list.length * 100)); }
      });
    }
    draw();
  }
  function drawSpeaking(d) {
    return '<h1 class="t" style="font-size:24px">Говорение · ' + esc(d.t) + '</h1><div class="card" style="margin-top:14px"><div class="qtext" style="font-size:20px">' + esc(d.prompt) + '</div><p class="s" style="margin:6px 0 10px">You should say:</p>' +
      d.points.map(function (p, i) { return '<label class="check"><input type="checkbox" data-p="' + i + '"><span>' + esc(p) + "</span></label>"; }).join("") +
      '<button class="btn ghost sm" id="sample" style="margin-top:8px">🔊 Прослушать тему</button>' +
      '<div class="note">Совет: отвечай вслух 1–2 минуты, затронув все пункты. Записывать не нужно.</div>' +
      '<button class="btn p" id="bnext" style="margin-top:14px" disabled>Завершить блок</button></div>';
  }
  function wireSpeaking(el) {
    var checks = el.querySelectorAll(".check input"), done = $("#bnext");
    checks.forEach(function (c) { c.addEventListener("change", function () { done.disabled = false; }); });
    $("#sample").addEventListener("click", function () { speak(RUN.plan.blocks[RUN.i].data.prompt + ". " + RUN.plan.blocks[RUN.i].data.points.join(". "), null); });
    done.addEventListener("click", function () { nextBlock(1); });
  }
  function drawTest(d) { return '<div class="block"><div class="bhead"><span class="bic">' + ic("file") + '</span><div><div class="btitle">' + esc(d.title) + '</div><div class="bsub">Проверка уровня · ответь на вопросы</div></div></div><div id="qarea"></div></div>'; }
  function wireTest(el) { wireQuiz(el, { q: RUN.plan.blocks[RUN.i].data.questions }, "test"); }

  function finishDay() {
    var c = course();
    var day = RUN.plan.day;
    var avg = RUN.results.length ? RUN.results.reduce(function (a, b) { return a + b; }, 0) / RUN.results.length : 100;
    var key = c.level + "-" + day;
    c.done[key] = { date: Date.now(), score: Math.round(avg) };
    if (c.prog) delete c.prog[key];
    var levelUp = false;
    if (RUN.plan.isTest) {
      c.passes[key] = Math.round(avg);
      if (avg >= 85) {
        var idx = C.LEVELS.indexOf(c.level);
        if (idx > -1 && idx < C.LEVELS.length - 1) { c.level = C.LEVELS[idx + 1]; c.day = 1; levelUp = true; }
      }
    }
    Lexy.save({ course: c });
    Lexy.addMin(15);
    var el = $("#s-path");
    el.innerHTML = '<div class="card" style="text-align:center;margin-top:40px"><div style="font-size:44px">🎉</div><h2 style="font:800 22px var(--display);margin:8px 0">' + (RUN.plan.isTest ? "Тест пройден!" : "День " + day + " пройден!") + '</h2><p class="s">' + (levelUp ? "Отличный результат — ты перешёл на уровень " + c.level + "!" : RUN.plan.isTest ? "Результат: " + Math.round(avg) + "%. Следуй дальше по курсу." : "Результат: " + Math.round(avg) + "%. Хорошая работа!") + '</p><button class="btn p" id="tocourse" style="margin-top:14px">К карте курса</button></div>';
    $("#tocourse").addEventListener("click", renderCourse);
  }

  /* ---------- ОЗВУЧКА (браузерная, бесплатно; polza.ai — далее) ---------- */
  var VOICE = null;
  function pickVoice() { if (!("speechSynthesis" in window)) return; var v = speechSynthesis.getVoices() || []; VOICE = v.filter(function (x) { return /en[-_](GB|US|AU)/i.test(x.lang); })[0] || v.filter(function (x) { return /^en/i.test(x.lang); })[0] || null; }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text, btn) {
    if (!("speechSynthesis" in window)) { Lexy.toast("Озвучка не поддерживается"); return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text); u.lang = (VOICE && VOICE.lang) || "en-GB"; if (VOICE) u.voice = VOICE; u.rate = 0.95;
    if (btn) { btn.dataset.playing = "1"; var t = btn.textContent; btn.textContent = "⏸ Стоп"; u.onend = u.onerror = function () { btn.dataset.playing = ""; btn.textContent = t; }; }
    speechSynthesis.speak(u);
  }

  /* ---------- ПРАКТИКА (ссылки на test.html) ---------- */
  function renderPractice() {
    var C2 = window.LexyContent, p = paid();
    if (!C2) { $("#s-practice").innerHTML = ""; return; }
    function ico(i, bg, c) { return '<span style="width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:' + bg + ";color:" + c + '">' + ic(i) + "</span>"; }
    var SK = [["reading", "Чтение", "book", "#E3F0FF", "#1E8FE8", "Тексты и вопросы"], ["listening", "Аудирование", "head", "#FFE0DB", "#E5443E", "Аудио с озвучкой"], ["writing", "Письмо", "pencil", "#FFE6D6", "#F7620B", "Эссе и структура"], ["speaking", "Говорение", "mic", "#FFF3CC", "#E59A00", "Монолог по карточке"]];
    var cards = SK.map(function (s) {
      var cnt = C2.count(s[0]), flc = C2.freeLimit(s[0]);
      return '<a href="test.html?skill=' + s[0] + '" style="display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px">' + ico(s[2], s[3], s[4]) + '<div style="flex:1"><b style="display:block;font:700 15px var(--body)">' + s[1] + '</b><small style="color:var(--soft)">' + s[5] + '</small><br><small style="color:var(--fire);font-weight:700">' + (p ? cnt + " заданий" : flc + " бесплатно из " + cnt) + "</small></div>" + ic("chev") + "</a>";
    }).join("");
    $("#s-practice").innerHTML = '<h1 class="t">Практика</h1><p class="s" style="margin-bottom:16px">Дополнительные задания по навыкам</p>' + cards;
  }

  /* ---------- ПРОГРЕСС (статистика — только платным) ---------- */
  function renderProgress() {
    var u = Lexy.user, n = Lexy.streakN(), m = Lexy.mins(), c = course();
    var DN = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
    var dots = Lexy.weekDots().map(function (d, i) { return '<div class="' + (d.on ? "on" : "") + '"><i>' + (d.on ? ic("fire") : "") + "</i>" + DN[i] + "</div>"; }).join("");
    var doneCount = Object.keys(c.done).length;
    var head = '<h1 class="t" style="margin-bottom:20px">Прогресс</h1>' +
      '<div class="stk"><div class="fc">' + fl(46) + "</div><small>Серия</small><h2>" + ic("fire") + " " + n + " " + dayWord(n) + ' подряд</h2><div class="wd">' + dots + "</div></div>";
    if (!paid()) {
      $("#s-progress").innerHTML = head + '<div class="card emp"><div class="eb">' + fl(30) + '</div><h3 style="text-align:center">Статистика в Premium</h3><p>Подробная статистика по уровням, блокам и баллам доступна на тарифах Pro и Pro+. Твой прогресс сохраняется — открой его вместе с Premium.</p><a class="btn p" href="pricing.html" style="margin-top:14px">Получить Premium</a></div>';
      return;
    }
    $("#s-progress").innerHTML = head +
      '<div class="card ls"><div class="r"><b>Уровень курса</b><span class="n">' + c.level + "</span></div><div class=\"r\"><b>Пройдено дней</b><span class=\"n\">" + doneCount + " из " + C.totalDays + '</span></div><div class="r"><b>Время с Lexy</b><span class="n">' + m.day + " мин сегодня · " + m.all + " всего</span></div></div>";
  }

  /* ---------- ЗАПУСК ---------- */
  Lexy.init("english", {
    render: {
      path: function () { course(); if (!Lexy.user.onboard) renderOnboard(); else renderCourse(); },
      practice: renderPractice,
      progress: renderProgress
    }
  });
})();
</script>
</body>
</html>
