  function testCard(done, total) {
    var all = done >= total;
    return '<div class="card testcard"><div class="tcent"><span class="bic">' + ic("file") + '</span><div><b>' + T("testTitle") + " " + course().level + "</b><small>" + (all ? T("testAll") : T("testHint")) + "</small></div></div>" +
      '<button class="btn p big" id="mtest">' + ic("play") + " " + T("testBtn") + "</button></div>";
  }

  function theoryBlock(level) {
    var LS = (window.LEXY_LESSONS && LEXY_LESSONS[level]) || [];
    if (!LS.length) return '<div class="card"><b>' + T("theoryT") + '</b><p class="s">—</p></div>';
    return LS.map(function (l, i) {
      var day = i + 1, info = accessInfo(level, day);
      return '<div class="card tcard' + (info ? " lockcard" : "") + '" data-tday="' + day + '"><span class="tnum">' + day + (info ? " 🔒" : "") + '</span><div class="tbody">' +
        '<div class="btitle" style="font-size:17px">' + esc(l.t) + '</div><p>' + esc(l.th.e) + '</p>' +
        '<div class="exlist" data-ex hidden>' + l.th.ex.map(function (x) { return "<div>" + esc(x) + "</div>"; }).join("") + "</div>" +
        '<div class="tsug">' + T("theoryTip") + '</div>' +
        '<div class="trow"><button class="btn ghost sm" data-tex>' + T("readMore") + '</button><button class="btn p sm" data-tlesson>' + T("openLesson") + '</button></div></div></div>';
    }).join("");
  }

  function histBlock() {
    if (!paid()) return '<div class="card lockcard"><b>' + T("histTitle") + '</b><p class="s">' + T("histLock") + '</p><a class="btn p sm" href="pricing.html" style="margin-top:10px">Premium</a></div>';
    var c = course();
    var keys = Object.keys(c.done).sort(function (a, b) { return (c.done[b].date || 0) - (c.done[a].date || 0); });
    if (!keys.length) return '<div class="card"><b>' + T("histTitle") + '</b><p class="s" style="margin-top:6px">' + T("histEmpty") + "</p></div>";
    return '<div class="card"><div style="font:800 18px var(--display);margin-bottom:8px">' + T("histTitle") + "</div>" +
      keys.slice(0, 40).map(function (k) { var d = c.done[k], p = k.split("-"); return '<div class="rw"><div><b>' + p[0] + " · " + T("dayTitle") + " " + p[1] + '</b><small>' + new Date(d.date).toLocaleDateString(lang() === "en" ? "en-GB" : "ru-RU", { day: "numeric", month: "long" }) + '</small></div><span class="nt" style="color:var(--ok);font-weight:700">' + (d.score != null ? d.score + "%" : "✓") + "</span></div>"; }).join("") + "</div>";
  }

  function changeLevelModal() {
    var c = course();
    Lexy.modal({ title: T("change"), body: '<div class="ol">' + LEVELS.map(function (l) { return '<button class="op' + (c.level === l[0] ? " on" : "") + '" data-pick="' + l[0] + '"><span class="lb2">' + l[0] + '</span><div>' + lvName(l[0], 0) + "<small>" + lvName(l[0], 1) + "</small></div></button>"; }).join("") + "</div>", foot: false });
    document.querySelectorAll("#mv [data-pick]").forEach(function (b) { b.addEventListener("click", function () { var cc = course(); cc.level = b.dataset.pick; Lexy.save({ course: cc }); Lexy.close(); renderCourse(); }); });
  }

  function runModuleTest() {
    var c = course(), t = C.moduleTest(c.level);
    RUN = { plan: { level: c.level, day: "test", isTest: true, title: T("testTitle") + " · " + c.level, blocks: [{ type: "test", data: t }] }, i: 0, results: [], t0: Date.now() };
    drawBlock();
  }

  $("#s-path").addEventListener("click", function (e) {
    var v = e.target.closest("[data-view]"); if (v) { mapView = v.dataset.view; renderCourse(); return; }
    if (e.target.closest("#mtest")) { runModuleTest(); return; }
    if (e.target.closest("[data-change]")) { changeLevelModal(); return; }
    var lv = course().level;
    var tex = e.target.closest("[data-tex]");
    if (tex) { var card = tex.closest(".tcard"), ex = card.querySelector("[data-ex]"); ex.hidden = !ex.hidden; tex.textContent = ex.hidden ? T("readMore") : T("hideExamples"); return; }
    var tl = e.target.closest("[data-tlesson]");
    if (tl) { var d1 = +tl.closest(".tcard").dataset.tday, i1 = accessInfo(lv, d1); if (i1) { lockModal(lv, d1, i1); return; } openDay(d1); return; }
    var d = e.target.closest("[data-day]"); if (d) { var day = +d.dataset.day, info = accessInfo(lv, day); if (info) { lockModal(lv, day, info); return; } openDay(day); }
  });

  function upsellDay() {
    Lexy.modal({ title: "Premium", body: "<p>" + T("free") + "</p>", ok: "Premium", cancel: T("stay"), onOk: function () { location.href = "pricing.html"; return false; } });
  }

  /* ---------- ПРОХОЖДЕНИЕ УРОКА ---------- */
  var RUN = null;
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function blockLabel(B) { return B.type === "theory" ? T("theoryT") : B.type === "listening" ? T("audio") : B.type === "test" ? T("testTitle") : (B.data && B.data.kind === "words") ? T("words") : (B.data && B.data.kind === "grammar") ? T("grammar") : T("practice"); }

  function openDay(day) {
    var c = course(), plan = C.plan(c.level, day), key = c.level + "-" + day;
    var start = (c.prog && c.prog[key] && c.prog[key].i) || 0;
    if (start >= plan.blocks.length) start = 0;
    RUN = { plan: plan, i: start, results: [] };
    drawBlock();
  }
  function drawBlock() {
    var el = $("#s-path");
    if (RUN.i >= RUN.plan.blocks.length) { finishDay(); return; }
    var cc = course(); cc.prog[RUN.plan.level + "-" + RUN.plan.day] = { i: RUN.i, ts: Date.now() }; Lexy.save({ course: cc });
    var B = RUN.plan.blocks[RUN.i];
    var dots = RUN.plan.blocks.map(function (x, idx) { return '<i class="' + (idx < RUN.i ? "done" : idx === RUN.i ? "on" : "") + '"></i>'; }).join("");
    var title = '<div class="crun-top"><button class="lnk" id="back">← ' + T("stay") + '</button><span class="lk">' + esc(RUN.plan.title || "") + '</span></div>';
    var body = B.type === "theory" ? drawTheory(B.data) : B.type === "listening" ? drawListening(B.data) : B.type === "test" ? drawTest(B.data) : B.type === "quiz" ? drawQuiz(B.data) : drawTheory(B.data);
    el.innerHTML = title + '<div class="dots">' + dots + "</div>" + body;
    $("#back").addEventListener("click", renderCourse);
    if (B.type === "theory") $("#bnext").addEventListener("click", function () { nextBlock(1); });
    else if (B.type === "listening") wireQuiz(el, B.data, true);
    else if (B.type === "test") wireTest(el, B.data);
    else if (B.type === "quiz") wireQuiz(el, B.data, false);
  }
  function nextBlock(score) { RUN.results.push(score || 0); RUN.i++; drawBlock(); }

  function drawTheory(d) {
    return '<div class="block"><div class="bhead"><span class="bic">' + ic("book") + '</span><div><div class="btitle">' + esc(d.t) + '</div><div class="bsub">' + T("theoryT") + '</div></div></div>' +
      '<div class="lesson"><p>' + esc(d.e) + "</p></div>" +
      '<div class="exlist">' + (d.ex || []).map(function (x) { return "<div>" + esc(x) + "</div>"; }).join("") + "</div>" +
      '<button class="btn p big" id="bnext" style="margin-top:18px">' + T("next") + " →</button></div>";
  }
  function drawListening(d) {
    var url = C.audioFor(d.script);
    return '<div class="block"><div class="bhead"><span class="bic">' + ic("head") + '</span><div><div class="btitle">' + T("audio") + '</div><div class="bsub">' + T("audio") + '</div></div></div>' +
      '<div class="player"><button class="pbtn" id="play">' + ic("play") + '</button><div class="ptx"><b>' + T("audio") + '</b><small>' + T("audio") + "</small></div></div>" + (url ? '<audio id="au" preload="none" src="' + url + '"></audio>' : "") +
      '<button class="btn ghost sm trbtn" id="showtr">' + T("theoryT") + "</button>" + '<div id="tr" hidden class="readpg" style="margin-top:10px">' + esc(d.script) + "</div>" +
      '<div id="qarea" style="margin-top:16px"></div></div>';
  }
  function drawQuiz(d) {
    return '<div class="block"><div class="bhead"><span class="bic">' + ic(d.kind === "words" ? "vocab" : d.kind === "grammar" ? "book" : "spark") + '</span><div><div class="btitle">' + T(d.kind === "words" ? "words" : d.kind === "grammar" ? "grammar" : "practice") + '</div><div class="bsub">' + (d.t ? esc(d.t) : "") + '</div></div></div><div id="qarea"></div></div>';
  }
  function drawTest(d) { return '<div class="block"><div class="bhead"><span class="bic">' + ic("file") + '</span><div><div class="btitle">' + esc(d.title) + '</div><div class="bsub" id="tmr"></div></div></div><div id="qarea"></div></div>'; }

  function wireQuiz(el, d, isListen) {
    if (isListen) {
      var pb = $("#play", el), au = $("#au", el);
      if (au) au.addEventListener("error", function () { au.dataset.fail = "1"; });
      if (pb) pb.addEventListener("click", function () { if (au && !au.dataset.fail) { try { var pr = au.play(); if (pr && pr.catch) pr.catch(function () { speak(d.script, pb); }); } catch (e) { speak(d.script, pb); } } else speak(d.script, pb); });
      var trb = $("#showtr", el), tr = $("#tr", el);
      if (trb && tr) trb.addEventListener("click", function () { tr.hidden = !tr.hidden; trb.textContent = tr.hidden ? T("theoryT") : T("stay"); });
    }
    var list = d.q || d.questions, i = 0, score = 0, answered = false, picked = null, opts = null, correct = 0;
    function draw() {
      var q = list[i];
      var mapped = (q.o || []).map(function (o, x) { return { o: o, c: x === q.a }; });
      mapped = shuffle(mapped.slice());
      correct = mapped.findIndex(function (x) { return x.c; });
      opts = mapped;
      $("#qarea", el).innerHTML = '<div class="qmeta"><span>' + T("question") + " " + (i + 1) + " / " + list.length + '</span></div><div class="qtext">' + esc(q.q) + '</div><div class="opts">' +
        mapped.map(function (o, x) { return '<button class="opt" data-x="' + x + '"><span class="key">' + "ABCD"[x] + "</span>" + esc(o.o) + "</button>"; }).join("") + "</div>" +
        '<button class="btn p big" id="nq" disabled style="margin-top:16px">' + T("next") + " →</button>";
      picked = null; answered = false;
      $("#qarea", el).querySelectorAll(".opt").forEach(function (b) { b.addEventListener("click", function () { if (answered) return; $("#qarea", el).querySelectorAll(".opt").forEach(function (x) { x.classList.remove("on"); }); b.classList.add("on"); picked = +b.dataset.x; $("#nq").disabled = false; }); });
      $("#nq").addEventListener("click", function () {
        if (picked == null) return;
        if (!answered) { answered = true; var all = $("#qarea", el).querySelectorAll(".opt"); all[correct].classList.add("right"); if (picked !== correct) all[picked].classList.add("wrong"); else score++; $("#nq").textContent = i === list.length - 1 ? T("finish") + " →" : T("next") + " →"; }
        else { i++; if (i < list.length) draw(); else nextBlock(Math.round(score / list.length * 100)); }
      });
    }
    draw();
  }
  var TMR = null;
  function wireTest(el, d) {
    if (TMR) clearInterval(TMR);
    var t0 = RUN.t0 || Date.now(), tmr = $("#tmr", el);
    TMR = setInterval(function () { var s = Math.floor((Date.now() - t0) / 1000); if (tmr && tmr.isConnected) tmr.textContent = T("time") + ": " + Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }, 500);
    wireQuiz(el, { q: d.questions }, false);
  }

  function finishDay() {
    var c = course(), day = RUN.plan.day;
    var avg = RUN.results.length ? RUN.results.reduce(function (a, b) { return a + b; }, 0) / RUN.results.length : 100;
    var key = c.level + "-" + day;
    var prev = c.done[key];
    c.done[key] = { date: Date.now(), score: prev && prev.score != null ? Math.max(prev.score, Math.round(avg)) : Math.round(avg) };
    if (c.prog) delete c.prog[key];
    var levelUp = false, passed = false;
    var elapsed = RUN.plan.isTest && RUN.t0 ? Math.round((Date.now() - RUN.t0) / 1000) : 0;
    if (RUN.plan.isTest) {
      c.passes[key] = Math.round(avg); passed = avg >= 60;
      if (avg >= 85) { var idx = C.LEVELS.indexOf(c.level); if (idx > -1 && idx < C.LEVELS.length - 1) { c.level = C.LEVELS[idx + 1]; levelUp = true; } }
    }
    Lexy.save({ course: c }); Lexy.addMin(15);
    if (TMR) { clearInterval(TMR); TMR = null; }
    var el = $("#s-path");
    var timeTxt = elapsed ? (T("time") + ": " + Math.floor(elapsed / 60) + " " + T("minutes") + " " + (elapsed % 60) + " " + T("sec")) : "";
    var sum = '<div class="card" style="text-align:center;margin-top:30px"><div style="font-size:44px">' + (RUN.plan.isTest ? "🏁" : "🎉") + '</div><h2 style="font:800 22px var(--display);margin:8px 0">' + (RUN.plan.isTest ? T("testTitle") : T("dayTitle") + " " + day) + '</h2>' +
      '<div class="scorebig">' + Math.round(avg) + "%</div><p class=\"s\">" + T("result") + ": " + Math.round(avg) + "%" + (timeTxt ? " · " + timeTxt : "") + "</p>" +
      (levelUp ? '<div class="card" style="background:#F1FBF6;border-color:#C8EAD7;margin-top:12px"><b>' + T("levelUp") + " " + c.level + "!</b></div>" : "") +
      '<button class="btn p big" id="tocourse" style="margin-top:14px">' + T("stay") + '</button>' +
      (levelUp ? '<button class="btn big" id="gonext" style="margin-top:10px;background:#12A15C;color:#fff">' + T("goNext") + " " + c.level + " →</button>" : "") + "</div>";
    el.innerHTML = sum;
    $("#tocourse").addEventListener("click", renderCourse);
    var gn = $("#gonext"); if (gn) gn.addEventListener("click", function () { renderCourse(); openDay(1); });
  }

  /* ---------- ОЗВУЧКА ---------- */
  var VOICE = null;
  function pickVoice() { if (!("speechSynthesis" in window)) return; var v = speechSynthesis.getVoices() || []; VOICE = v.filter(function (x) { return /en[-_](GB|US|AU)/i.test(x.lang); })[0] || v.filter(function (x) { return /^en/i.test(x.lang); })[0] || null; }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text, btn) { if (!("speechSynthesis" in window)) { Lexy.toast("—"); return; } speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text); u.lang = (VOICE && VOICE.lang) || "en-GB"; if (VOICE) u.voice = VOICE; u.rate = 0.95; if (btn) { var t = btn.textContent; u.onend = u.onerror = function () { btn.textContent = t; }; } speechSynthesis.speak(u); }

  /* ---------- ПРАКТИКА ---------- */
  function renderPractice() {
    var C2 = window.LexyContent, p = paid();
    if (!C2) { $("#s-practice").innerHTML = ""; return; }
    function ico(i, bg, c) { return '<span style="width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:' + bg + ";color:" + c + '">' + ic(i) + "</span>"; }
    var SK = [["reading", "Reading", "book", "#E3F0FF", "#1E8FE8"], ["listening", "Listening", "head", "#FFE0DB", "#E5443E"], ["writing", "Writing", "pencil", "#FFE6D6", "#F7620B"], ["speaking", "Speaking", "mic", "#FFF3CC", "#E59A00"]];
    var cards = SK.map(function (s) { var cnt = C2.count(s[0]), flc = C2.freeLimit(s[0]); return '<a href="test.html?skill=' + s[0] + '" style="display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px">' + ico(s[2], s[3], s[4]) + '<div style="flex:1"><b style="display:block;font:700 15px var(--body)">' + s[1] + '</b><small style="color:var(--fire);font-weight:700">' + (p ? cnt : flc + "/" + cnt) + "</small></div>" + ic("chev") + "</a>"; }).join("");
    $("#s-practice").innerHTML = '<h1 class="t">' + T("practice") + '</h1><p class="s" style="margin-bottom:16px">' + T("practiceSub") + "</p>" + cards;
  }

  /* ---------- ПРОГРЕСС ---------- */
  function renderProgress() {
    var u = Lexy.user, n = Lexy.streakN(), m = Lexy.mins(), c = course();
    var DN = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
    var dots = Lexy.weekDots().map(function (d, i) { return '<div class="' + (d.on ? "on" : "") + '"><i>' + (d.on ? ic("fire") : "") + "</i>" + DN[i] + "</div>"; }).join("");
    var doneCount = Object.keys(c.done).length;
    var head = '<h1 class="t" style="margin-bottom:20px">' + T("progress") + '</h1><div class="stk"><div class="fc">' + fl(46) + "</div><small>" + T("streak") + "</small><h2>" + ic("fire") + " " + n + '</h2><div class="wd">' + dots + "</div></div>";
    if (!paid()) { $("#s-progress").innerHTML = head + '<div class="card emp"><div class="eb">' + fl(30) + '</div><h3 style="text-align:center">' + T("statPrem") + "</h3><p>" + T("statPremBody") + '</p><a class="btn p" href="pricing.html" style="margin-top:14px">Premium</a></div>'; return; }
    $("#s-progress").innerHTML = head + '<div class="card ls"><div class="r"><b>' + T("level") + '</b><span class="n">' + c.level + '</span></div><div class="r"><b>' + T("lessonsDone") + '</b><span class="n">' + doneCount + " / " + C.totalDays(c.level) + '</span></div><div class="r"><b>' + T("time") + '</b><span class="n">' + m.day + " / " + m.all + " " + T("minutes") + "</span></div></div>";
  }

  /* ---------- ЗАПУСК ---------- */
  function renderTalk() {
    var body = paid()
      ? '<div class="card" style="margin-top:20px"><h3 style="font:800 20px var(--display);letter-spacing:-.02em">' + T("talkTitle") + '</h3><p class="s">' + T("talkSub") + '</p><a class="btn v" href="game-shadow.html">' + T("talkBtn") + "</a></div>"
      : '<div class="card" style="text-align:center;margin-top:20px"><div style="font-size:38px">🔒</div><h2 style="font:800 22px var(--display);margin:10px 0">' + T("premTitle") + "</h2><p class=\"s\">" + T("premBody") + '</p><a class="btn p" href="pricing.html" style="margin-top:12px">' + T("premBtn") + "</a></div>";
    $("#s-talk").innerHTML = '<h1 class="t">' + T("talk") + "</h1>" + body;
  }

  Lexy.init("english", { render: { path: function () { course(); if (!Lexy.user.onboard) renderOnboard(); else renderCourse(); }, practice: renderPractice, progress: renderProgress, talk: renderTalk } });
})();
</script>
</body>
</html>
