<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("lang");if(l)document.documentElement.setAttribute("lang",l);}catch(e){}</script>
<title>История попыток — GoLexi</title>
<link rel="stylesheet" href="golexi/fonts.css">
<link rel="stylesheet" href="golexi/app.css">
<style>:root{--font-unbounded:"Unbounded";--font-onest:"Onest"}html,body{margin:0}</style>
<script src="lexy-config.js?v=7"></script>
<script src="lexy-auth.js?v=12"></script>
</head>
<body>
<main class="mx-auto w-full max-w-5xl px-4 py-6 md:px-8 md:py-10">
  <div class="mb-6 flex items-center justify-between gap-3">
    <h1 class="display text-3xl font-bold">История попыток</h1>
    <a href="dashboard-ielts.html#tests" class="btn btn-ghost btn-sm">← К тестам</a>
  </div>
  <div id="list" class="grid gap-3"></div>
</main>
<script src="lexy-ielts-data.js?v=1"></script>
<script>
(function () {
  var D = window.LEXY_IELTS || {};
  var SEC = { reading: "Reading", listening: "Listening", writing: "Writing", speaking: "Speaking" };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function titleOf(section, taskId) {
    var list = D[section] || [];
    var t = list.filter(function (x) { return x.id === taskId; })[0];
    if (!t) return taskId;
    if (section === "reading" || section === "listening") return t.title;
    if (section === "writing") return (t.task === "task1" ? "Task 1" : "Task 2") + ": " + t.type;
    return "Part " + t.part + " · " + t.topic;
  }
  function render() {
    var el = document.getElementById("list");
    var u = (window.LexyAuth && LexyAuth.user && LexyAuth.user()) || null;
    if (!u) { el.innerHTML = '<div class="card p-6"><p class="text-muted">Войди в аккаунт, чтобы увидеть историю.</p><a class="btn btn-fire mt-4" href="login.html">Войти</a></div>'; return; }
    var att = Array.isArray(u.attempts) ? u.attempts.slice() : [];
    att.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
    if (!att.length) { el.innerHTML = '<div class="card p-6"><p class="text-muted">Пока нет попыток. Пройди первый тест.</p><a class="btn btn-fire mt-4" href="dashboard-ielts.html#tests">К тестам</a></div>'; return; }
    el.innerHTML = att.map(function (a) {
      var date = a.ts ? new Date(a.ts).toLocaleDateString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
      var review = "";
      try { if (sessionStorage.getItem("lexy-attempt-" + a.id)) review = '<a class="btn btn-ghost btn-sm" href="ielts-result.html#' + esc(a.id) + '">Разбор</a>'; } catch (e) {}
      return '<div class="card flex flex-wrap items-center gap-4 p-5">' +
        '<span class="grid size-11 shrink-0 place-items-center rounded-2xl bg-fire-soft font-bold text-fire-text">' + esc(SEC[a.section] || "") + '</span>' +
        '<div class="min-w-0 flex-1"><p class="font-bold">' + esc(titleOf(a.section, a.taskId)) + '</p><p class="text-sm text-muted">' + esc(SEC[a.section] || "") + ' · ' + esc(date) + '</p></div>' +
        '<span class="display text-2xl font-extrabold">' + (Number(a.band) || 0).toFixed(1) + '</span>' +
        '<div class="flex gap-2"><a class="btn btn-fire btn-sm" href="ielts-run.html#/' + esc(a.section) + '/' + esc(a.taskId) + '">Повторить</a>' + review + '</div>' +
        '</div>';
    }).join("");
  }
  function boot() {
    if (!window.LexyAuth) return render();
    Promise.resolve(LexyAuth.refresh ? LexyAuth.refresh() : null).then(render).catch(render);
    setTimeout(render, 1500);
  }
  if (document.readyState !== "loading") boot(); else document.addEventListener("DOMContentLoaded", boot);
})();
</script>
<script src="golexi-i18n.js?v=1"></script>
</body>
</html>
